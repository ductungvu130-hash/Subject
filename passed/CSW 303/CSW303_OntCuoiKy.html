<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSW 303 — Ôn Thi Cuối Kỳ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#30363d;--border2:#3d444d;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --accent:#58a6ff;--accent2:#1f6feb;
  --green:#3fb950;--green2:#238636;
  --red:#f85149;--red2:#da3633;
  --yellow:#d29922;--purple:#a371f7;--orange:#f0883e;
  --r:8px;--r2:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Be Vietnam Pro',sans-serif;font-size:15px;line-height:1.6}
.app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:272px;min-width:272px;background:var(--bg2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:18px 14px 14px;border-bottom:1px solid var(--border)}
.logo-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.logo-pill{background:linear-gradient(135deg,var(--accent2),var(--purple));
  color:#fff;font-weight:700;font-size:11px;padding:3px 9px;border-radius:6px;letter-spacing:.5px}
.sb-title{font-size:13px;font-weight:700}
.sb-sub{font-size:11px;color:var(--text3);margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 6px}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav-sec{margin-bottom:3px}
.wk-hdr{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r);
  cursor:pointer;user-select:none;transition:background .15s}
.wk-hdr:hover{background:var(--bg3)}
.wk-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.wk-name{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-cnt{font-size:10px;color:var(--text3);background:var(--bg4);
  padding:1px 5px;border-radius:8px;flex-shrink:0}
.wk-chev{font-size:9px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.wk-hdr.open .wk-chev{transform:rotate(90deg)}
.wk-quizzes{display:none;padding-left:22px;margin-top:1px}
.wk-quizzes.open{display:block}
.qz-btn{display:block;width:100%;text-align:left;padding:5px 10px;border-radius:var(--r);
  background:none;border:none;cursor:pointer;font-family:inherit;font-size:12px;
  color:var(--text2);transition:all .15s;margin-bottom:1px}
.qz-btn:hover{background:var(--bg3);color:var(--text)}
.qz-btn.sel{background:var(--accent2);color:#fff}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border)}
.g-btn{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:var(--r);
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  transition:all .15s;width:100%;text-align:left;margin-bottom:5px}
.g-btn:hover{background:var(--bg4)}
.g-btn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}
.g-btn.pri:hover{background:var(--accent)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);flex-shrink:0;gap:16px}
.tb-title{font-size:15px;font-weight:700}
.tb-sub{font-size:11px;color:var(--text3)}
.mode-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r);padding:3px;gap:2px}
.m-tab{padding:5px 13px;border-radius:6px;background:none;border:none;
  color:var(--text2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.m-tab.active{background:var(--accent2);color:#fff}
.lang-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.sw{position:relative;width:34px;height:19px;cursor:pointer}
.sw input{display:none}
.sw-track{display:block;width:100%;height:100%;background:var(--bg4);
  border-radius:10px;border:1px solid var(--border2);transition:background .2s}
.sw input:checked~.sw-track{background:var(--accent2);border-color:var(--accent2)}
.sw-thumb{position:absolute;top:3px;left:3px;width:13px;height:13px;
  background:#fff;border-radius:50%;transition:transform .2s}
.sw input:checked~.sw-thumb{transform:translateX(15px)}
.content{flex:1;overflow-y:auto;padding:22px}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Home ── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r2);padding:14px 18px;text-align:center}
.stat-n{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1}
.stat-l{font-size:10px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.sec-title{font-size:12px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:28px}
.wk-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);
  padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.wk-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--cc,var(--accent))}
.wk-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.wk-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.wk-num{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-family:'JetBrains Mono',monospace}
.wk-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;color:#fff}
.wk-card-title{font-size:14px;font-weight:700;margin-bottom:6px}
.wk-card-meta{font-size:11px;color:var(--text3)}
.pb{margin-top:12px;background:var(--bg4);border-radius:3px;height:3px;overflow:hidden}
.pb-fill{height:100%;border-radius:3px;transition:width .4s}

/* ── Quiz ── */
.qhdr{display:flex;align-items:center;margin-bottom:18px;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.qprog-num{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;white-space:nowrap}
.qprog-bar{flex:1;background:var(--bg4);border-radius:4px;height:6px;overflow:hidden}
.qprog-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.q-score{display:flex;gap:10px;font-size:13px;font-weight:600;white-space:nowrap}
.sc{color:var(--green)}.sw2{color:var(--red)}
.qcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);
  padding:24px 26px;margin-bottom:14px;max-width:820px}
.q-meta{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.qbadge{font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:500;
  color:var(--text3);background:var(--bg4);padding:2px 7px;border-radius:5px;border:1px solid var(--border)}
.multi-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;
  background:rgba(163,113,247,.15);color:var(--purple);border:1px solid rgba(163,113,247,.3)}
.qt{font-size:16px;font-weight:600;line-height:1.65;margin-bottom:4px;white-space:pre-wrap}
.qt-vi{font-size:13px;color:var(--text2);font-style:italic;margin-bottom:6px;display:none}
.show-vi .qt-vi{display:block}

/* code inside question */
.qt .code-block{
  display:block;margin:10px 0;padding:12px 14px;
  background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);
  font-family:'JetBrains Mono',monospace;font-size:13px;
  color:#a5d6ff;line-height:1.7;white-space:pre;overflow-x:auto}

.opts{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.opt-btn{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;
  border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;
  text-align:left;transition:all .15s;width:100%;line-height:1.5}
.opt-btn:hover:not(:disabled){background:var(--bg4);border-color:var(--accent)}
.opt-btn:disabled{cursor:default}
.opt-let{display:inline-flex;align-items:center;justify-content:center;
  width:25px;height:25px;min-width:25px;border-radius:6px;background:var(--bg4);
  border:1px solid var(--border2);font-size:11px;font-weight:700;
  font-family:'JetBrains Mono',monospace;color:var(--text2);transition:all .15s}
.opt-btn.correct{background:rgba(63,185,80,.1);border-color:var(--green)}
.opt-btn.correct .opt-let{background:var(--green2);border-color:var(--green);color:#fff}
.opt-btn.wrong{background:rgba(248,81,73,.1);border-color:var(--red)}
.opt-btn.wrong .opt-let{background:var(--red2);border-color:var(--red);color:#fff}
.opt-btn.reveal{border-color:var(--green);opacity:.65}
.fb{display:none;margin-top:10px;padding:10px 14px;border-radius:var(--r);
  font-size:13px;font-weight:500;align-items:center;gap:7px}
.fb.show{display:flex}
.fb.ok{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.fb.ng{background:rgba(248,81,73,.1);color:var(--red);border:1px solid rgba(248,81,73,.3)}
.fb.info{background:rgba(163,113,247,.1);color:var(--purple);border:1px solid rgba(163,113,247,.3)}
.q-actions{display:flex;gap:9px;margin-top:18px;max-width:820px}
.btn{padding:9px 18px;border-radius:var(--r);font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;border:none;transition:all .15s;
  display:inline-flex;align-items:center;gap:5px}
.btn-p{background:var(--accent2);color:#fff}.btn-p:hover{background:var(--accent)}
.btn-s{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-s:hover{background:var(--bg4)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Results ── */
.res-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);
  padding:36px;max-width:560px;text-align:center}
.res-pct{font-size:68px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;margin-bottom:6px}
.res-lbl{font-size:13px;color:var(--text2);margin-bottom:24px}
.res-stats{display:flex;justify-content:center;gap:28px;padding:14px;
  background:var(--bg3);border-radius:var(--r);margin-bottom:22px}
.rs-n{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace}
.rs-l{font-size:10px;color:var(--text3);margin-top:2px}
.res-acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ── Review ── */
.rv-ctrl{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:180px;display:flex;align-items:center;gap:7px;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:7px 11px}
.search-box input{flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:inherit;font-size:13px}
.search-box input::placeholder{color:var(--text3)}
.flt-sel{padding:7px 11px;border-radius:var(--r);background:var(--bg2);
  border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer;outline:none}
.rv-cnt{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.rv-list{display:flex;flex-direction:column;gap:8px;max-width:860px}
.rv-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;transition:border-color .15s}
.rv-item:hover{border-color:var(--border2)}
.rv-q{padding:14px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.rv-num{font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--text3);
  background:var(--bg4);padding:2px 6px;border-radius:4px;border:1px solid var(--border);
  white-space:nowrap;margin-top:2px;flex-shrink:0}
.rv-q-txt{flex:1}
.rv-q-en{font-size:14px;font-weight:500;line-height:1.5;white-space:pre-wrap}
.rv-q-vi{font-size:12px;color:var(--text3);font-style:italic;margin-top:2px;display:none}
.show-vi .rv-q-vi{display:block}
.rv-chev{font-size:9px;color:var(--text3);transition:transform .2s;flex-shrink:0;margin-top:5px}
.rv-item.open .rv-chev{transform:rotate(180deg)}
.rv-ans{display:none;border-top:1px solid var(--border);padding:14px 18px}
.rv-item.open .rv-ans{display:block}
.rv-opts{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.rv-opt{display:flex;gap:8px;padding:9px 11px;border-radius:var(--r);
  font-size:13px;border:1px solid transparent}
.rv-opt.ok{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:var(--green)}
.rv-opt.ng{background:var(--bg3);color:var(--text2)}
.rv-opt-l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;min-width:18px}

/* code in review */
.rv-opt .code-block,.rv-q-en .code-block{
  display:block;margin:8px 0;padding:10px 12px;
  background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);
  font-family:'JetBrains Mono',monospace;font-size:12px;
  color:#a5d6ff;line-height:1.7;white-space:pre;overflow-x:auto}

@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadeIn .22s ease both}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="sb-head">
    <div class="logo-row"><span class="logo-pill">CSW 303</span></div>
    <div class="sb-title">Ôn Thi Cuối Kỳ</div>
    <div class="sb-sub">327 câu hỏi · 8 tuần · 22 quiz</div>
  </div>
  <div class="sb-nav" id="sbNav"></div>
  <div class="sb-foot">
    <button class="g-btn pri" onclick="startAll()">▶ Luyện Tập Toàn Bộ</button>
    <button class="g-btn" onclick="startShuffle()">⇄ Trộn Ngẫu Nhiên</button>
    <button class="g-btn" onclick="showHome()">⌂ Trang Chủ</button>
  </div>
</div>
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:0">
      <div style="min-width:0">
        <div class="tb-title" id="tbTitle">CSW 303 — Tổng quan</div>
        <div class="tb-sub" id="tbSub"></div>
      </div>
      <div class="mode-tabs" id="modeTabs" style="display:none">
        <button class="m-tab active" onclick="setMode('quiz')" data-m="quiz">📝 Luyện Tập</button>
        <button class="m-tab" onclick="setMode('review')" data-m="review">📖 Xem Đáp Án</button>
      </div>
    </div>
    <div class="lang-row">
      <span>EN</span>
      <label class="sw"><input type="checkbox" id="langChk" onchange="onLang()">
        <span class="sw-track"></span><span class="sw-thumb"></span></label>
      <span>VI</span>
    </div>
  </div>
  <div class="content" id="cnt"></div>
</div>
</div>
<script>
const QS = [{"num": 1, "q_en": "Which sequence correctly describes the flow of changes from your local edits to the remote server in Git?", "q_vi": "Trình tự nào mô tả chính xác luồng thay đổi từ các chỉnh sửa cục bộ của bạn đến máy chủ remote trong git?", "options": {"A": "Working Directory → Local Commits → Staging Area → Remote", "B": "Staging Area → Working Directory → Remote → Local Commits", "C": "Working Directory → Staging Area → Local Commits → Remote", "D": "Local Commits → Remote → Staging Area → Working Directory"}, "answer": "C", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "Starting a New Local Project: Grace wants to start a new project in a folder on her computer named project-alpha. The project does not exist on a remote server yet. What is the very first Git command she should run inside the folder?", "q_vi": "Bắt đầu một dự án cục bộ mới: Grace muốn bắt đầu một dự án mới trong một thư mục trên máy tính của cô ấy có tên project-alpha. Dự án chưa tồn tại trên máy chủ remote. Lệnh git đầu tiên cô ấy nên chạy trong thư mục là gì?", "options": {"A": "git clone project-alpha", "B": "git init", "C": "git remote add origin ...", "D": "git commit"}, "answer": "B", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "Ignoring Generated Files: Henry is working on a project that generates log files (*.log) and a build output directory (/dist). He wants Git to completely ignore these files. What should he do?", "q_vi": "Bỏ qua các tệp đã tạo: Henry đang làm việc trên một dự án tạo các tệp log (*.log) và thư mục đầu ra bản dựng (/dist). Anh ấy muốn git hoàn toàn bỏ qua những tệp này. Anh ấy nên làm gì?", "options": {"A": "Run git clean -fd before every commit.", "B": "Add the lines *.log and /dist to a .gitignore file.", "C": "Manually delete the files before running git add.", "D": "Use git update-index --assume-unchanged on the files."}, "answer": "B", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "What is the primary function of a .gitignore file?", "q_vi": "Chức năng chính của tệp .gitignore là gì?", "options": {"A": "To list files that Git should permanently delete from the project history.", "B": "To specify files and directories that Git should intentionally not track, such as build artifacts or local environment files.", "C": "To mark certain project files as required so that Git always includes them in every commit, even when they have not been modified.", "D": "To set up and manage user-wide preferences, credentials, and default behaviors for Git across all repositories on your machine."}, "answer": "B", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "The Accidental add: Ken is preparing a commit and uses git add . to stage everything. He then realizes he accidentally staged a sensitive file, secrets.env. How can he remove this file from the staging area while keeping it in his working directory?", "q_vi": "Phần bổ sung tình cờ: Ken đang chuẩn bị một cam kết và sử dụng git add . để dàn dựng mọi thứ. Sau đó anh ta nhận ra mình đã vô tình dàn dựng một tệp nhạy cảm, secret.env. Làm cách nào anh ta có thể xóa tệp này khỏi khu vực staging trong khi vẫn giữ nó trong thư mục làm việc của mình?", "options": {"A": "git rm --cached secrets.env", "B": "git reset secrets.env or git restore --staged secrets.env", "C": "git checkout -- secrets.env", "D": "Delete the file and then restore it from the last commit."}, "answer": "B", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "What is the most significant advantage of using branches in your development workflow?", "q_vi": "Ưu điểm quan trọng nhất của việc sử dụng các nhánh trong quy trình phát triển của bạn là gì?", "options": {"A": "They create separate, encrypted backup copies of your entire codebase that can be restored if data is lost.", "B": "They reduce the amount of disk space a repository uses by storing only compressed deltas instead of full file copies on every branch.", "C": "They allow you to work on new features or fixes in isolation without disrupting the stability of the main codebase.", "D": "They automatically resolve merge conflicts between different developers."}, "answer": "C", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "A Forgotten File: Alice just made a commit with the message \"feat: Add user login form\". She immediately realizes she forgot to git add the new CSS file that styles the form. She has not pushed her commit yet. What is the most efficient way for Alice to add the missing CSS file to her last commit?", "q_vi": "Một tệp bị lãng quên: Alice vừa thực hiện một cam kết với thông báo \"feat: Thêm biểu mẫu đăng nhập người dùng\". Cô ngay lập tức nhận ra mình đã quên git add tệp CSS mới tạo kiểu cho biểu mẫu. Cô ấy vẫn chưa đẩy mạnh cam kết của mình. Cách hiệu quả nhất để Alice thêm tệp CSS bị thiếu vào lần xác nhận cuối cùng của cô ấy là gì?", "options": {"A": "Create a new commit with the message \"fix: Add missing Cascading Style Sheets (CSS)\".", "B": "Use git reset --hard HEAD~1 (HEAD is the current commit pointer) and then re-commit both files.", "C": "Use git add style.css and then git commit --amend.", "D": "Use git revert HEAD to undo the commit and start over."}, "answer": "C", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "What is the key difference between the git fetch and git pull commands?", "q_vi": "Sự khác biệt chính giữa lệnh git tìm nạp và git pull là gì?", "options": {"A": "git fetch uploads your changes, while git pull downloads them.", "B": "git pull is an older, deprecated command, whereas git fetch is the modern replacement.", "C": "git fetch only works for the main branch, while git pull works for all branches.", "D": "git fetch downloads remote updates but does not merge them, while git pull downloads and merges them into your current branch."}, "answer": "D", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "Which of the following best describes the \"Feature branch + Pull Request\" collaboration workflow?", "q_vi": "Điều nào sau đây mô tả đúng nhất quy trình cộng tác \"Nhánh tính năng + Yêu cầu kéo\"?", "options": {"A": "All team members push and commit their finished work directly onto the shared main branch without using separate feature branches.", "B": "Work is done on a separate branch, pushed to the remote, and then a request is opened for code review before merging.", "C": "A single, long-running branch is used for development, staging, and production environments.", "D": "Developers frequently merge small, unreviewed changes to the main branch throughout the day."}, "answer": "B", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "Resolving a Merge Conflict: Noah is merging main into his branch, and Git reports a MERGE_CONFLICT. He opens the conflicted file, manually edits it to fix the conflict markers (<<<<<, >>>>>), and saves it. What are the next two commands he must run to complete the merge?", "q_vi": "Giải quyết xung đột hợp nhất: Noah đang hợp nhất main vào chi nhánh của mình và git báo cáo MERGE_CONFLICT. Anh ta mở tệp bị xung đột, chỉnh sửa thủ công để sửa các dấu hiệu xung đột (<<<<<, >>>>>) và lưu nó. Hai lệnh tiếp theo anh ta phải chạy để hoàn thành việc hợp nhất là gì?", "options": {"A": "git commit and then git merge --continue", "B": "git add <conflicted_file> and then git merge --continue", "C": "git rebase --continue", "D": "git status and then git commit"}, "answer": "B", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q10", "multi": false}, {"num": 11, "q_en": "What is the recommended strategy for avoiding merge conflicts on a long-running feature branch?", "q_vi": "Chiến lược được đề xuất để tránh xung đột hợp nhất trên một nhánh tính năng dài hạn là gì?", "options": {"A": "Wait until every part of the feature is done and tested before pushing your branch to the remote repository for the first time.", "B": "Frequently merge or rebase the main branch into your feature branch to stay up-to-date.", "C": "Do not pull or merge any updates from the main branch into your feature branch until the feature is ready for final integration.", "D": "Delete and recreate the branch from main whenever a major change happens on main."}, "answer": "B", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q11", "multi": false}, {"num": 12, "q_en": "Staying Synced with an Upstream Fork: Jake has forked an open-source project and cloned his fork. To contribute effectively, he needs to keep his fork updated with the original project. How should he configure his local repo to do this?", "q_vi": "Luôn đồng bộ hóa với Upstream Fork: Jake đã phân nhánh một dự án nguồn mở và nhân bản phân nhánh của mình. Để đóng góp hiệu quả, anh ấy cần cập nhật dự án ban đầu của mình. Anh ta nên cấu hình kho lưu trữ cục bộ của mình như thế nào để thực hiện việc này?", "options": {"A": "Delete your local copy and run git clone on the original repository again each day to get the latest changes.", "B": "Download or copy updated source files from the original project's website and paste them into your local fork by hand.", "C": "Add the original project's Uniform Resource Locator (URL) as a remote named upstream.", "D": "Submit his pull requests by pushing commits straight to the main branch of the original upstream repository without going through his fork."}, "answer": "C", "week": "Week01", "quiz": "Quiz01", "id": "Week01_Quiz01_Q12", "multi": false}, {"num": 1, "q_en": "In which scenario is git revert the most appropriate command to use?", "q_vi": "Lệnh git hoàn nguyên thích hợp nhất để sử dụng trong trường hợp nào?", "options": {"A": "When you want to undo a commit that has already been pushed to a shared branch without rewriting history.", "B": "When you want to revise only the commit message of your most recent local commit that has not yet been pushed to a shared remote branch.", "C": "When you need to combine the last three commits on your local branch into a single commit.", "D": "When you want to permanently discard every uncommitted modification in both your working directory and your staging area."}, "answer": "A", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q1", "multi": false}, {"num": 2, "q_en": "What is the primary function of the git reflog command?", "q_vi": "Chức năng chính của lệnh git reflog là gì?", "options": {"A": "To list every remote repository alias configured for the project along with its associated fetch and push URLs.", "B": "To provide a log of where your HEAD (current commit pointer) and branch pointers have been, acting as a safety net to recover \"lost\" work.", "C": "To show the complete commit history of the current branch in a paginated log format that can include patch diffs for each commit.", "D": "To prune expired reflog entries and unreachable loose objects from the local Git repository over time so that overall disk usage on the machine is reduced."}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q2", "multi": false}, {"num": 3, "q_en": "Bob is in the middle of developing a complex new feature. Suddenly, a critical bug is reported in production. Bob needs to fix the bug immediately, but his current work is unfinished and not ready to be committed. What should Bob do to safely set aside his current work so he can switch branches?", "q_vi": "Bob đang trong quá trình phát triển một tính năng mới phức tạp. Đột nhiên, một lỗi nghiêm trọng được báo cáo trong quá trình sản xuất. Bob cần sửa lỗi ngay lập tức, nhưng công việc hiện tại của anh ấy vẫn chưa hoàn thành và chưa sẵn sàng để cam kết. Bob nên làm gì để an toàn gác lại công việc hiện tại để có thể chuyển ngành?", "options": {"A": "Run git commit -m \"Work In Progress (WIP)\" to save the unfinished work.", "B": "Run git stash to temporarily shelve his changes.", "C": "Run git reset --hard to discard his current work.", "D": "Run git clean -fd to remove all untracked files."}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q3", "multi": false}, {"num": 4, "q_en": "When is the git stash command most useful?", "q_vi": "Khi nào lệnh git stash hữu ích nhất?", "options": {"A": "When you want to permanently save a version of your code as an official release.", "B": "When you need to switch to another branch but have unfinished work you aren't ready to commit.", "C": "When you need to remove every untracked file and directory from your working tree while leaving all tracked project files exactly as they are.", "D": "When you have finished your work and are ready to push it to the remote repository."}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q4", "multi": false}, {"num": 5, "q_en": "Frank has finished a feature on his branch. The history contains 10 small, messy commits like \"fix typo,\" \"wip,\" and \"try another thing.\" Before opening a Pull Request (PR), he wants to combine them into two meaningful commits to make the history easier to review. Which command should he use?", "q_vi": "Frank đã hoàn thành một tính năng trên nhánh của mình. Lịch sử chứa 10 cam kết nhỏ, lộn xộn như \"sửa lỗi đánh máy\", \"xóa\" và \"thử cách khác\". Trước khi mở Yêu cầu kéo (PR), anh ấy muốn kết hợp chúng thành hai cam kết có ý nghĩa để giúp xem lại lịch sử dễ dàng hơn. Anh ta nên sử dụng lệnh nào?", "options": {"A": "git merge --squash main", "B": "git rebase -i HEAD~10", "C": "git commit --amend for each of the 10 commits.", "D": "git filter-branch"}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q5", "multi": false}, {"num": 6, "q_en": "Isabella has modified three files but has not staged them yet. She wants to see a line-by-line view of all the changes she has made in her working directory compared to the last commit. Which command will show her this?", "q_vi": "Isabella đã sửa đổi ba tệp nhưng chưa sắp xếp chúng. Cô ấy muốn xem từng dòng một của tất cả những thay đổi cô ấy đã thực hiện trong thư mục làm việc của mình so với lần chuyển giao cuối cùng. Lệnh nào sẽ cho cô ấy thấy điều này?", "options": {"A": "git status", "B": "git log -p", "C": "git diff", "D": "git diff --staged"}, "answer": "C", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q6", "multi": false}, {"num": 7, "q_en": "What information does the git blame command provide for a specific file?", "q_vi": "Lệnh git đổ lỗi cung cấp thông tin gì cho một tệp cụ thể?", "options": {"A": "It shows which developer is responsible for the most bugs in that file.", "B": "It provides a line-by-line breakdown of who last changed each line and in which commit.", "C": "It displays a comprehensive summary of every merge conflict that has been recorded throughout the entire version history of that specific file.", "D": "It generates a detailed report that describes how the file's size and modification patterns have evolved across commits over time."}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q7", "multi": false}, {"num": 8, "q_en": "A feature that was working in last month's release (tagged v1.5.0) is now broken on the main branch. David needs to find the exact commit that introduced this regression among the dozens of commits made since the release. What is the most efficient Git tool for this task?", "q_vi": "Một tính năng đang hoạt động trong bản phát hành tháng trước (được gắn thẻ v1.5.0) hiện đã bị hỏng trên nhánh chính. David cần tìm ra cam kết chính xác đã đưa ra sự hồi quy này trong số hàng chục cam kết được thực hiện kể từ khi phát hành. Công cụ git hiệu quả nhất cho nhiệm vụ này là gì?", "options": {"A": "git blame <file>", "B": "git log -p", "C": "git bisect", "D": "git show <commit>"}, "answer": "C", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q8", "multi": false}, {"num": 9, "q_en": "Liam's team is ready to deploy version 2.0.0. The final commit is on main. He needs to create a permanent, formal marker for this specific commit that includes a message about the release. What should he use?", "q_vi": "Nhóm của Liam đã sẵn sàng triển khai phiên bản 2.0.0. Commit cuối cùng là trên main. Anh ta cần tạo một điểm đánh dấu chính thức, lâu dài cho cam kết cụ thể này bao gồm thông báo về việc phát hành. Anh ta nên sử dụng cái gì?", "options": {"A": "git branch v2.0.0", "B": "git tag -a v2.0.0 -m \"Version 2.0.0 release\"", "C": "git commit --allow-empty -m \"Release v2.0.0\"", "D": "git note add -m \"v2.0.0\""}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q9", "multi": false}, {"num": 10, "q_en": "Maria is trying to add a 500MB machine learning model file (model.h5) to her project. Her team uses Git Large File Storage (LFS). What is the correct procedure for her to add this file?", "q_vi": "Maria đang cố gắng thêm tệp mô hình học máy 500 MB (model.h5) vào dự án của mình. Nhóm của cô ấy sử dụng git Large File Storage (LFS). Quy trình chính xác để cô ấy thêm tệp này là gì?", "options": {"A": "Add model.h5 to .gitignore to keep the repo small.", "B": "Run git lfs track \"*.h5\", then git add .gitattributes model.h5.", "C": "Commit the file normally; Git will handle it automatically.", "D": "Zip the file and then commit the .zip archive."}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q10", "multi": false}, {"num": 11, "q_en": "How does Git Large File Storage (LFS) help manage large binary files?", "q_vi": "git Large File Storage (LFS) giúp quản lý các tệp nhị phân lớn như thế nào?", "options": {"A": "It prevents any individual file whose uncompressed size exceeds one hundred megabytes from ever being added to the repository's object database.", "B": "It stores the content of large files on an external server, placing only lightweight pointers in the Git history.", "C": "It automatically applies lossless compression to binary assets so they occupy less space inside the repository without requiring manual intervention.", "D": "It converts binary file contents into a human-readable text representation so that Git's standard textual diff tools can compare versions line by line."}, "answer": "B", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q11", "multi": false}, {"num": 12, "q_en": "Olivia wants to see a compact, graphical view of the commit history from all branches, not just her current one. What is the best command to get this rich, condensed overview?", "q_vi": "Olivia muốn xem một cái nhìn đồ họa, nhỏ gọn về lịch sử cam kết từ tất cả các nhánh, không chỉ chi nhánh hiện tại của cô ấy. Lệnh tốt nhất để có được cái nhìn tổng quan phong phú, cô đọng này là gì?", "options": {"A": "git log -p --all", "B": "git shortlog --summary", "C": "git log --oneline --graph --decorate --all", "D": "git log --simplify-by-decoration"}, "answer": "C", "week": "Week01", "quiz": "Quiz02", "id": "Week01_Quiz02_Q12", "multi": false}, {"num": 1, "q_en": "What is the primary goal of software testing?", "q_vi": "Mục tiêu chính của kiểm thử phần mềm là gì?", "options": {"A": "To execute a program with the intent of finding errors.", "B": "To prove that the software has no bugs.", "C": "To write as many test cases as possible.", "D": "To speed up the development process."}, "answer": "A", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "Consider the following Python function:\n\ndef is_even(n):\n    return n % 2 == 0\n\nWhich of the following test cases will FAIL?", "q_vi": "Hãy xem xét hàm Python sau:", "options": {"A": "assert is_even(4) == True", "B": "assert is_even(0) == True", "C": "assert is_even(-2) == True", "D": "assert is_even(3) == True."}, "answer": "D", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "Which of the following best describes an \"understanding error\"?", "q_vi": "Điều nào sau đây mô tả đúng nhất về \"lỗi hiểu biết\"?", "options": {"A": "A developer makes a mistake with the upper bound of a loop, causing an \"off-by-1\" error.", "B": "A developer misunderstands the requirements and doesn't handle an unexpected data format.", "C": "A developer forgets to close a database connection, causing a performance issue.", "D": "A developer uses an inefficient algorithm that slows down the program."}, "answer": "B", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "Given the following function:\n\ndef divide(a, b):\n    return a / b\n\nWhich test cases will FAIL?", "q_vi": "Cho hàm sau:", "options": {"A": "assert divide(6, 2) == 3", "B": "assert divide(5, 2) == 2.5", "C": "assert divide(1, 0) == 0.", "D": "assert divide(-4, 2) == -2"}, "answer": "C", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "Which type of testing is primarily concerned with whether the software works quickly and can handle the expected user load?", "q_vi": "Loại thử nghiệm nào chủ yếu quan tâm đến việc phần mềm có hoạt động nhanh và có thể xử lý tải lượng người dùng dự kiến ​​hay không?", "options": {"A": "Functional Testing", "B": "User Testing", "C": "Performance and Load Testing.", "D": "Security Testing"}, "answer": "C", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "Consider the function:\n\ndef get_last_item(items):\n    return items[-1]\n\nWhich test will FAIL?", "q_vi": "Xét hàm số:", "options": {"A": "assert get_last_item([1, 2, 3]) == 3", "B": "assert get_last_item(['a']) == 'a'", "C": "assert get_last_item([]) == None.", "D": "assert get_last_item([True, False]) == False"}, "answer": "C", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "A company asks a group of its own developers and a few select users to test an early version of a product to get feedback on planned features. What is this process called?", "q_vi": "Một công ty yêu cầu một nhóm các nhà phát triển của chính mình và một số người dùng được chọn thử nghiệm phiên bản đầu tiên của sản phẩm để nhận phản hồi về các tính năng đã lên kế hoạch. Quá trình này được gọi là gì?", "options": {"A": "Beta Testing", "B": "Release Testing", "C": "Alpha Testing.", "D": "Unit Testing"}, "answer": "C", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "Given the following function:\n\ndef add(a, b):\n    return a + b\n\nFill in the missing expected value so the test verifies addition of negative numbers:\n\nassert add(-2, -3) == ____", "q_vi": "Cho hàm sau:", "options": {"A": "-5"}, "answer": "A", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "What is the fundamental limitation of software testing?", "q_vi": "Hạn chế cơ bản của kiểm thử phần mềm là gì?", "options": {"A": "It is too expensive and time-consuming for most projects.", "B": "It can only be performed by specialized quality assurance engineers.", "C": "It requires complex tools that are difficult to learn.", "D": "It can demonstrate the presence of faults, but cannot prove their absence."}, "answer": "D", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "Consider the function:\n\ndef max_value(a, b):\n    if a > b:\n        return a\n    return b\n\nWhich test will FAIL?", "q_vi": "Xét hàm số:", "options": {"A": "assert max_value(3, 5) == 5", "B": "assert max_value(10, 2) == 10", "C": "assert max_value(4, 4) == 4", "D": "assert max_value(-1, -2) == -2."}, "answer": "D", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q10", "multi": false}, {"num": 11, "q_en": "A test is considered to \"pass\" under which condition?", "q_vi": "Một bài thi được coi là “đạt” với điều kiện nào?", "options": {"A": "The program runs without crashing.", "B": "The program's behavior matches the expected behavior.", "C": "The program executes all lines of code at least once.", "D": "The program is approved by the product manager."}, "answer": "B", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q11", "multi": false}, {"num": 12, "q_en": "Given:\n\ndef get_item(items, index):\n    return items[index]\n\nWhich test will PASS?", "q_vi": "Cho trước:", "options": {"A": "assert get_item([1, 2, 3], 3) == None", "B": "assert get_item([], 0) == None", "C": "assert get_item(['a', 'b'], 1) == 'b'.", "D": "assert get_item([10], -2) == 10"}, "answer": "C", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q12", "multi": false}, {"num": 13, "q_en": "A developer creating a program to process a sequence of items makes a mistake and fails to process the very last element. This is a classic example of what?", "q_vi": "Một nhà phát triển tạo chương trình xử lý một chuỗi các mục sẽ mắc lỗi và không xử lý được phần tử cuối cùng. Đây là một ví dụ cổ điển về cái gì?", "options": {"A": "An understanding error", "B": "A requirements error", "C": "An \"off-by-one\" programming error.", "D": "A system integration error"}, "answer": "C", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q13", "multi": false}, {"num": 14, "q_en": "Which type of testing focuses on validating the functionality of the overall system and discovering as many implementation bugs as possible?", "q_vi": "Loại thử nghiệm nào tập trung vào việc xác thực chức năng của hệ thống tổng thể và phát hiện càng nhiều lỗi triển khai càng tốt?", "options": {"A": "User Testing", "B": "Functional Testing.", "C": "Performance Testing", "D": "Security Testing"}, "answer": "B", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q14", "multi": false}, {"num": 15, "q_en": "Given:\n\ndef is_positive(n):\n    return n > 0\n\nWhich assertion best tests the boundary condition?", "q_vi": "Cho:", "options": {"A": "assert is_positive(10) == True", "B": "assert is_positive(1) == True", "C": "assert is_positive(0) == False.", "D": "assert is_positive(100) == True"}, "answer": "C", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q15", "multi": false}, {"num": 16, "q_en": "The goal of which testing type is to ensure the software maintains its integrity and can protect user information from theft and damage?", "q_vi": "Mục tiêu của loại thử nghiệm nào là đảm bảo phần mềm duy trì tính toàn vẹn và có thể bảo vệ thông tin người dùng khỏi bị đánh cắp và hư hỏng?", "options": {"A": "User Testing", "B": "Release Testing", "C": "Performance Testing", "D": "Security Testing."}, "answer": "D", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q16", "multi": false}, {"num": 17, "q_en": "Complete the test to ensure the function returns True for empty input:\n\ndef is_empty(items):\n    return len(items) == 0\n\nassert is_empty([]) == ____", "q_vi": "Hoàn thành kiểm tra để đảm bảo hàm trả về True cho đầu vào trống:", "options": {"A": "True", "B": "TRUE"}, "answer": "A,B", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q17", "multi": true}, {"num": 18, "q_en": "When a software company distributes an early version of its product to a large, external group of users for comments on its usability in their own environments, what is this called?", "q_vi": "Khi một công ty phần mềm phân phối phiên bản đầu tiên của sản phẩm của mình cho một nhóm lớn người dùng bên ngoài để nhận xét về khả năng sử dụng của nó trong môi trường của chính họ, điều này được gọi là gì?", "options": {"A": "Alpha Testing", "B": "Beta Testing.", "C": "System Testing", "D": "Functional Testing"}, "answer": "B", "week": "Week02", "quiz": "Quiz01", "id": "Week02_Quiz01_Q18", "multi": false}, {"num": 1, "q_en": "What is the primary goal of functional testing?", "q_vi": "Mục tiêu chính của kiểm tra chức năng là gì?", "options": {"A": "To ensure the code is easy to read and maintain.", "B": "To check if users find the product useful and easy to use.", "C": "To test the system's response time under a heavy user load.", "D": "To find bugs and provide evidence that the system is fit for its purpose."}, "answer": "D", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q1", "multi": false}, {"num": 2, "q_en": "Which sequence correctly orders the stages of functional testing, from the smallest component to the complete system?", "q_vi": "Trình tự nào sắp xếp chính xác các giai đoạn kiểm tra chức năng, từ thành phần nhỏ nhất đến hệ thống hoàn chỉnh?", "options": {"A": "System testing → Feature testing → Unit testing → Release testing", "B": "Unit testing → System testing → Feature testing → Release testing", "C": "Unit testing → Feature testing → System testing → Release testing", "D": "Feature testing → Unit testing → Release testing → System testing"}, "answer": "C", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q2", "multi": false}, {"num": 3, "q_en": "What is the main objective of unit testing?", "q_vi": "Mục tiêu chính của kiểm thử đơn vị là gì?", "options": {"A": "To test that a complete user feature works as intended.", "B": "To decide if the software is good enough for customers.", "C": "To test program units, like functions or methods, in isolation.", "D": "To test the interactions between multiple system features."}, "answer": "C", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q3", "multi": false}, {"num": 4, "q_en": "In the context of unit testing, which of the following best defines a \"code unit\"?", "q_vi": "Trong bối cảnh thử nghiệm đơn vị, điều nào sau đây định nghĩa đúng nhất về \"đơn vị mã\"?", "options": {"A": "The entire software product.", "B": "A single line of code written by a developer.", "C": "A specific feature requested by a user.", "D": "Anything with a clearly defined responsibility, like a function or class method."}, "answer": "D", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q4", "multi": false}, {"num": 5, "q_en": "What is the fundamental principle behind using equivalence partitions to design tests?", "q_vi": "Nguyên tắc cơ bản đằng sau việc sử dụng phân vùng tương đương để thiết kế các bài kiểm tra là gì?", "options": {"A": "To divide the code into equal parts for different testers to work on.", "B": "To group inputs that are treated similarly by the code, so that one test can represent the entire group.", "C": "To focus exclusively on inputs that are known to have caused errors in the past.", "D": "To test every single possible input to guarantee the program is completely free of faults."}, "answer": "B", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q5", "multi": false}, {"num": 6, "q_en": "When designing unit tests, why is it important to also identify \"incorrectness partitions\"?", "q_vi": "Khi thiết kế các bài kiểm thử đơn vị, tại sao việc xác định \"các phân vùng không chính xác\" lại quan trọng?", "options": {"A": "To test that the program correctly detects and handles invalid inputs as expected.", "B": "To make the overall test suite smaller and faster to run.", "C": "To prove that the program will never fail under any circumstances.", "D": "To avoid testing edge cases that are unlikely to occur in production."}, "answer": "A", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q6", "multi": false}, {"num": 7, "q_en": "Feature testing is primarily concerned with which aspect of software development?", "q_vi": "Kiểm tra tính năng chủ yếu liên quan đến khía cạnh nào của phát triển phần mềm?", "options": {"A": "Verifying that individual functions work correctly in isolation.", "B": "Ensuring that integrated code units work together to provide useful functionality.", "C": "Checking the system's performance and stability under heavy load.", "D": "Finding security vulnerabilities that an attacker might be able to exploit."}, "answer": "B", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q7", "multi": false}, {"num": 8, "q_en": "Feature testing involves two types of tests: \"interaction tests\" and \"usefulness tests.\" What is the main goal of usefulness tests?", "q_vi": "Kiểm tra tính năng bao gồm hai loại kiểm tra: \"kiểm tra tương tác\" và \"kiểm tra tính hữu ích\". Mục tiêu chính của các bài kiểm tra tính hữu ích là gì?", "options": {"A": "To check for bugs in how different code units are integrated.", "B": "To verify that the feature implements something that users actually want or need.", "C": "To ensure the feature's code is optimized for maximum speed.", "D": "To confirm that all individual code units passed their own tests."}, "answer": "B", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q8", "multi": false}, {"num": 9, "q_en": "How are user stories often utilized in the feature testing process?", "q_vi": "Câu chuyện của người dùng thường được sử dụng như thế nào trong quá trình thử nghiệm tính năng?", "options": {"A": "They are converted directly into the final user documentation.", "B": "They are used only for high-level system testing, not feature testing.", "C": "They serve as a basis for organizing tests to ensure the feature aligns with real-world user scenarios.", "D": "They are used by marketing teams to create advertisements for the product."}, "answer": "C", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q9", "multi": false}, {"num": 10, "q_en": "A primary goal of system testing, which is not typically covered in unit or feature testing, is to:", "q_vi": "Mục tiêu chính của kiểm thử hệ thống, thường không được đề cập trong kiểm thử đơn vị hoặc tính năng, là:", "options": {"A": "test a single function to verify its return value.", "B": "discover unexpected and unwanted interactions between different system features.", "C": "check the code for proper syntax and adherence to style guides.", "D": "verify the logic of an individual class method in isolation."}, "answer": "B", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q10", "multi": false}, {"num": 11, "q_en": "Beyond checking for feature interactions, what is another crucial objective of system testing?", "q_vi": "Ngoài việc kiểm tra các tương tác tính năng, mục tiêu quan trọng khác của kiểm thử hệ thống là gì?", "options": {"A": "Ensuring every single line of code has been executed at least once.", "B": "Confirming that the development team has met its deadline.", "C": "Verifying that the system operates correctly in the different environments where it will be used.", "D": "Making sure each developer has written enough unit tests for their code."}, "answer": "C", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q11", "multi": false}, {"num": 12, "q_en": "According to the provided text, what is an effective way to systematically conduct system testing?", "q_vi": "Theo văn bản được cung cấp, cách hiệu quả để tiến hành thử nghiệm hệ thống một cách có hệ thống là gì?", "options": {"A": "By having the original programmer test their own code without guidance.", "B": "By starting with a set of scenarios describing possible user tasks and working through them.", "C": "By focusing only on the newest features that have been recently added.", "D": "By randomly clicking buttons and entering data to try to crash the system."}, "answer": "B", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q12", "multi": false}, {"num": 13, "q_en": "What is a key distinction between release testing and system testing?", "q_vi": "Điểm khác biệt chính giữa thử nghiệm phát hành và thử nghiệm hệ thống là gì?", "options": {"A": "Release testing is automated, while system testing is always manual.", "B": "Release testing focuses on finding every possible bug, while system testing focuses on performance.", "C": "System testing is done in a test environment, while release testing is done in the real operational environment.", "D": "System testing is performed by end-users, while release testing is performed by developers."}, "answer": "C", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q13", "multi": false}, {"num": 14, "q_en": "The main purpose of release testing is to:", "q_vi": "Mục đích chính của thử nghiệm phát hành là:", "options": {"A": "find and fix every remaining bug in the software.", "B": "provide developers with feedback on code quality.", "C": "decide if the system is good enough to be released to customers.", "D": "test each new feature as soon as it is developed."}, "answer": "C", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q14", "multi": false}, {"num": 15, "q_en": "At which stage of functional testing would a developer specifically check that several code units, possibly created by different programmers, are correctly integrated to deliver a single piece of user functionality?", "q_vi": "Ở giai đoạn nào của thử nghiệm chức năng, nhà phát triển sẽ kiểm tra cụ thể xem một số đơn vị mã, có thể được tạo bởi các lập trình viên khác nhau, có được tích hợp chính xác để cung cấp một phần chức năng cho người dùng không?", "options": {"A": "Unit testing", "B": "Feature testing", "C": "System testing", "D": "Release testing"}, "answer": "B", "week": "Week02", "quiz": "Quiz02", "id": "Week02_Quiz02_Q15", "multi": false}, {"num": 1, "q_en": "What is the core idea behind test automation?", "q_vi": "Ý tưởng cốt lõi đằng sau việc tự động hóa thử nghiệm là gì?", "options": {"A": "Tests are written as manual scripts for a human to follow.", "B": "Only the user interface (UI) parts of an application are tested.", "C": "Tests are written as executable code that can run without manual intervention.", "D": "The goal is to prove that the software has no bugs at all."}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q1", "multi": false}, {"num": 2, "q_en": "The \"Arrange-Action-Assert\" pattern is a common structure for automated tests.\n\nWhat happens during the \"Assert\" step?", "q_vi": "Mẫu \"Sắp xếp-Hành động-Khẳng định\" là cấu trúc phổ biến cho các thử nghiệm tự động.", "options": {"A": "Test parameters and the test environment are set up.", "B": "The code unit being tested is called with specific inputs.", "C": "The test checks if the actual result from the code matches the expected outcome.", "D": "The results of the test are reported to the development team."}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q2", "multi": false}, {"num": 3, "q_en": "You are given the following test code fragments written in Python.\n\nBlock A\n result = add(2, 3)\n\nBlock B\n a = 2\nb = 3\n\nBlock C\n assert result == 5\n\nWhich option correctly orders the blocks according to the Arrange–Action–Assert (AAA) pattern?", "q_vi": "Bạn được cung cấp các đoạn mã kiểm tra sau đây được viết bằng Python.", "options": {"A": "Block A → Block B → Block C", "B": "Block B → Block C → Block A", "C": "Block B → Block A → Block C", "D": "Block C → Block A → Block B"}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q3", "multi": false}, {"num": 4, "q_en": "Consider the following Python test fragments.\n\nBlock A\n numbers = [1, 2, 3]\n\nBlock B\n numbers.append(4)\n\nBlock C\n assert len(numbers) == 4\n\nWhich option correctly orders the blocks according to the Arrange–Action–Assert (AAA) pattern?", "q_vi": "Hãy xem xét các đoạn thử nghiệm Python sau đây.", "options": {"A": "Block A → Block B → Block C", "B": "Block B → Block A → Block C", "C": "Block A → Block C → Block B", "D": "Block C → Block A → Block B"}, "answer": "A", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q4", "multi": false}, {"num": 5, "q_en": "You are given parts of a Python unit test.\n\nBlock A\n text = \"hello\"\n\nBlock B\n assert result == \"HELLO\"\n\nBlock C\n result = text.upper()\n\nWhich option correctly orders the blocks according to the Arrange–Action–Assert (AAA) pattern?", "q_vi": "Bạn được cung cấp các phần của bài kiểm tra đơn vị Python.", "options": {"A": "Block C → Block A → Block B", "B": "Block B → Block C → Block A", "C": "Block A → Block B → Block C", "D": "Block A → Block C → Block B"}, "answer": "D", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q5", "multi": false}, {"num": 6, "q_en": "What is the definition of regression testing?", "q_vi": "Định nghĩa của thử nghiệm hồi quy là gì?", "options": {"A": "The process of writing new tests for a newly developed feature.", "B": "The process of re-running previous tests after a change to ensure nothing has broken.", "C": "The process of manually testing the software just before a major release.", "D": "The process of removing old, outdated tests from the test suite."}, "answer": "B", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q6", "multi": false}, {"num": 7, "q_en": "What is the most significant advantage of having an automated test suite for regression testing?", "q_vi": "Ưu điểm quan trọng nhất của việc có bộ kiểm tra tự động để kiểm tra hồi quy là gì?", "options": {"A": "It eliminates the need for any manual testing whatsoever.", "B": "It guarantees that no new bugs will ever be introduced into the code.", "C": "It allows thousands of tests to be run in seconds, giving teams the confidence to make changes safely and quickly.", "D": "It automatically generates new test cases based on user behavior."}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q7", "multi": false}, {"num": 8, "q_en": "What is the main principle of the Test Pyramid model proposed by Mike Cohn?", "q_vi": "Nguyên tắc chính của mô hình Kim tự tháp thử nghiệm do Mike Cohn đề xuất là gì?", "options": {"A": "To guide the structure of an automated test suite, emphasizing a large number of fast unit tests at the base.", "B": "To ensure that every developer writes the same number of tests.", "C": "To mandate that 100% of testing must be automated.", "D": "To focus testing efforts primarily on the user interface because it's what the customer sees."}, "answer": "A", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q8", "multi": false}, {"num": 9, "q_en": "According to the Test Pyramid, why should you have significantly more unit tests than system/UI tests?", "q_vi": "Theo Kim tự tháp kiểm thử, tại sao bạn nên thực hiện nhiều bài kiểm thử đơn vị hơn đáng kể so với kiểm thử hệ thống/giao diện người dùng?", "options": {"A": "Unit tests are more interesting for developers to write.", "B": "System tests are unable to find important bugs.", "C": "Unit tests are much faster, more stable, and pinpoint problems more precisely than higher-level tests.", "D": "UI tests can only be performed manually and cannot be automated."}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q9", "multi": false}, {"num": 10, "q_en": "Which statement best describes Test-Driven Development (TDD)?", "q_vi": "Câu nào mô tả đúng nhất về Phát triển dựa trên thử nghiệm (TDD)?", "options": {"A": "A process where you write production code first and then write tests for it later.", "B": "A process where you write an automated test before you write the production code needed to make it pass.", "C": "A methodology where a separate testing team is solely responsible for all testing activities.", "D": "A technique focused only on testing the security aspects of an application."}, "answer": "B", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q10", "multi": false}, {"num": 11, "q_en": "What is the correct sequence of the TDD cycle?", "q_vi": "Trình tự đúng của chu trình TDD là gì?", "options": {"A": "Green → Red → Refactor", "B": "Red → Refactor → Green", "C": "Refactor → Red → Green", "D": "Red → Green → Refactor"}, "answer": "D", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q11", "multi": false}, {"num": 12, "q_en": "In the TDD cycle, what is the primary purpose of the \"Red\" phase?", "q_vi": "Trong chu trình TDD, mục đích chính của giai đoạn “Đỏ” là gì?", "options": {"A": "To write the simplest possible production code.", "B": "To clean up and improve the code that was just written.", "C": "To write a small, specific test that fails because the required functionality does not yet exist.", "D": "To run all existing tests to make sure they are still passing."}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q12", "multi": false}, {"num": 13, "q_en": "After a test passes in the \"Green\" phase of TDD, what is the goal of the \"Refactor\" phase?", "q_vi": "Sau khi vượt qua thử nghiệm ở giai đoạn \"Xanh\" của TDD, mục tiêu của giai đoạn \"Tái cấu trúc\" là gì?", "options": {"A": "To write another failing test for the next piece of functionality.", "B": "To deploy the code immediately to production.", "C": "To clean up and improve the code's design without changing its behavior, confident that the tests will catch any regressions.", "D": "To ask another developer to review the code."}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q13", "multi": false}, {"num": 14, "q_en": "Which of the following is a key benefit of practicing TDD?", "q_vi": "Điều nào sau đây là lợi ích chính của việc thực hành TDD?", "options": {"A": "It completely eliminates the need for code reviews.", "B": "It guarantees that the software will be 100% bug-free.", "C": "The resulting tests act as a form of executable documentation that is always up-to-date with the code.", "D": "It is the fastest way to write code, especially for projects with unclear requirements."}, "answer": "C", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q14", "multi": false}, {"num": 15, "q_en": "According to the course materials, what is a potential challenge or downside of TDD?", "q_vi": "Theo tài liệu của khóa học, thách thức hoặc nhược điểm tiềm ẩn của TDD là gì?", "options": {"A": "It results in having too few tests to cover the codebase.", "B": "It can discourage developers from making radical refactoring changes if it means rewriting many tests.", "C": "It simplifies debugging to the point where developers no longer learn valuable skills.", "D": "It only works for user interface testing and cannot be used for backend logic."}, "answer": "B", "week": "Week02", "quiz": "Quiz03", "id": "Week02_Quiz03_Q15", "multi": false}, {"num": 1, "q_en": "What is the primary definition of a code review?", "q_vi": "Định nghĩa chính của đánh giá mã là gì?", "options": {"A": "An automated process that scans code for performance issues.", "B": "A formal meeting where project managers approve code for deployment.", "C": "Systematic, peer-evaluation process where developers check each other's code for correctness and quality.", "D": "The act of a single developer re-reading their own code before submitting it."}, "answer": "C", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q1", "multi": false}, {"num": 2, "q_en": "Why are code reviews a critical complement to automated testing?", "q_vi": "Tại sao việc đánh giá mã lại là sự bổ sung quan trọng cho thử nghiệm tự động?", "options": {"A": "They are much faster than running a full suite of automated tests.", "B": "They can find bugs caused by a misunderstanding of requirements, which automated tests would likely miss.", "C": "They focus only on the visual aspects of the user interface.", "D": "They completely eliminate the need for any further testing."}, "answer": "B", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q2", "multi": false}, {"num": 3, "q_en": "Besides finding bugs, what is another significant benefit of conducting regular code reviews?", "q_vi": "Ngoài việc tìm ra lỗi, lợi ích đáng kể nào khác của việc tiến hành đánh giá mã thường xuyên là gì?", "options": {"A": "It helps determine which developer writes the fewest bugs.", "B": "It serves as the primary way to calculate project costs.", "C": "It is an excellent method for sharing knowledge about the codebase across the team.", "D": "It is a substitute for writing technical documentation."}, "answer": "C", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q3", "multi": false}, {"num": 4, "q_en": "Which of the following issues is most effectively identified through a code review rather than by running functional tests?", "q_vi": "Vấn đề nào sau đây được xác định hiệu quả nhất thông qua việc xem xét mã thay vì chạy thử nghiệm chức năng?", "options": {"A": "A calculation that produces an incorrect numerical result.", "B": "A part of the program that crashes when given a null input.", "C": "Code that is poorly organized and difficult to understand, even if it works correctly.", "D": "A feature that doesn't meet its required response time under load."}, "answer": "C", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q4", "multi": false}, {"num": 5, "q_en": "According to the course materials, what should a reviewer examine in addition to the program code being reviewed?", "q_vi": "Theo tài liệu khóa học, người đánh giá nên kiểm tra những gì ngoài mã chương trình đang được xem xét?", "options": {"A": "The developer's previous performance reports.", "B": "The project's marketing and sales strategy.", "C": "The automated tests written for the code to ensure they are complete and correct.", "D": "The time it took the programmer to write the code."}, "answer": "C", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q5", "multi": false}, {"num": 6, "q_en": "What kind of culture should be fostered for code reviews to be successful?", "q_vi": "Loại văn hóa nào cần được nuôi dưỡng để việc đánh giá mã thành công?", "options": {"A": "A highly competitive one, where reviewers try to find the most flaws to prove their expertise.", "B": "A culture where reviews are seen as a way to formally evaluate and rank programmers.", "C": "A positive and collaborative one, where the goal is to improve the code, not to criticize the programmer.", "D": "A culture where programmers are expected to reject all feedback to show confidence in their work."}, "answer": "C", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q6", "multi": false}, {"num": 7, "q_en": "Which of the following is listed as a key area to look for in a code review checklist?", "q_vi": "Điều nào sau đây được liệt kê là lĩnh vực chính cần tìm trong danh sách kiểm tra đánh giá mã?", "options": {"A": "The number of lines of code written.", "B": "The time spent on the task.", "C": "The correctness of the code and whether it handles edge cases.", "D": "The programming language used."}, "answer": "C", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q7", "multi": false}, {"num": 8, "q_en": "What is the recommended best practice for the scope of a single code review session?", "q_vi": "Cách thực hành tốt nhất được đề xuất cho phạm vi của một phiên đánh giá mã đơn lẻ là gì?", "options": {"A": "To cover as much code as possible in a single day.", "B": "To focus on a manageable amount of code (e.g., 200-400 lines) in a session lasting about an hour.", "C": "To only review code written by senior developers.", "D": "To continue the review until every participant agrees the code is perfect."}, "answer": "B", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q8", "multi": false}, {"num": 9, "q_en": "Modern code review tools often integrate with code repositories like GitHub. What is the primary benefit of this integration?", "q_vi": "Các công cụ đánh giá mã hiện đại thường tích hợp với kho mã như GitHub. Lợi ích chính của việc tích hợp này là gì?", "options": {"A": "It allows the tool to automatically fix all identified bugs.", "B": "It can automatically set up a code review whenever a programmer submits new code.", "C": "It prevents programmers from submitting code that contains any bugs.", "D": "It replaces the need for any human involvement in the review process."}, "answer": "B", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q9", "multi": false}, {"num": 10, "q_en": "Why is a checklist a useful tool for a code reviewer?", "q_vi": "Tại sao danh sách kiểm tra là một công cụ hữu ích cho người đánh giá mã?", "options": {"A": "It helps the reviewer remember to check for common types of errors and ensures consistency.", "B": "It serves as a legally binding contract between the programmer and the reviewer.", "C": "It automatically scores the quality of the code on a scale of 1 to 10.", "D": "It provides the exact code changes that need to be made."}, "answer": "A", "week": "Week02", "quiz": "Quiz04", "id": "Week02_Quiz04_Q10", "multi": false}, {"num": 1, "q_en": "Which of the following is NOT typically part of a CI pipeline?", "q_vi": "Phần nào sau đây KHÔNG thường là một phần của quy trình CI?", "options": {"A": "Unit testing", "B": "Code checkout", "C": "Docker image build", "D": "Marketing plan review"}, "answer": "D", "week": "Week02", "quiz": "Quiz05", "id": "Week02_Quiz05_Q1", "multi": false}, {"num": 2, "q_en": "What is the purpose of caching dependencies in CI?", "q_vi": "Mục đích của việc lưu vào bộ đệm phụ thuộc trong CI là gì?", "options": {"A": "To make builds slower for accuracy", "B": "To skip testing", "C": "To speed up repeated builds by reusing unchanged files", "D": "To reduce code coverage"}, "answer": "C", "week": "Week02", "quiz": "Quiz05", "id": "Week02_Quiz05_Q2", "multi": false}, {"num": 3, "q_en": "Why is containerization valuable in CI/CD pipelines?", "q_vi": "Tại sao việc đóng container lại có giá trị trong đường ống CI/CD?", "options": {"A": "Containers ensure consistent environments across stages", "B": "Containers are slower than VMs", "C": "Containers remove the need for testing", "D": "Containers replace all scripts"}, "answer": "A", "week": "Week02", "quiz": "Quiz05", "id": "Week02_Quiz05_Q3", "multi": false}, {"num": 4, "q_en": "Which metric is part of the DORA metrics for DevOps performance?", "q_vi": "Số liệu nào là một phần của số liệu DORA cho hiệu suất DevOps?", "options": {"A": "Number of developers on a project", "B": "Deployment frequency", "C": "Total code size", "D": "Meeting hours per week"}, "answer": "B", "week": "Week02", "quiz": "Quiz05", "id": "Week02_Quiz05_Q4", "multi": false}, {"num": 5, "q_en": "What is a common cause of pipeline failures in CI/CD?", "q_vi": "Nguyên nhân phổ biến gây ra sự cố đường ống trong CI/CD là gì?", "options": {"A": "Too many reviewers", "B": "Flaky or unstable tests", "C": "Fast network connections", "D": "Use of YAML syntax"}, "answer": "B", "week": "Week02", "quiz": "Quiz05", "id": "Week02_Quiz05_Q5", "multi": false}, {"num": 6, "q_en": "What is the benefit of ‘fail fast’ in pipeline design?", "q_vi": "Lợi ích của việc ‘thất bại nhanh chóng’ trong thiết kế đường ống là gì?", "options": {"A": "It hides test results", "B": "It saves time by detecting errors early", "C": "It ensures all jobs run regardless of failure", "D": "It only applies to manual testing"}, "answer": "B", "week": "Week02", "quiz": "Quiz05", "id": "Week02_Quiz05_Q6", "multi": false}, {"num": 7, "q_en": "In a CD pipeline, what does blue-green deployment help achieve?", "q_vi": "Trong quy trình CD, việc triển khai xanh lam giúp đạt được điều gì?", "options": {"A": "Simultaneous deployment to all servers", "B": "Instant rollback and minimal downtime during releases", "C": "Random user routing", "D": "Cost reduction by halving infrastructure"}, "answer": "B", "week": "Week02", "quiz": "Quiz05", "id": "Week02_Quiz05_Q7", "multi": false}, {"num": 1, "q_en": "Besides preventing security attacks, what is a key reliability reason for input validation?", "q_vi": "Bên cạnh việc ngăn chặn các cuộc tấn công bảo mật, lý do chính đáng tin cậy để xác thực đầu vào là gì?", "options": {"A": "To prevent \"database pollution\" from accidentally incorrect data.", "B": "To make the user interface load faster.", "C": "To reduce the program's memory usage.", "D": "To ensure all inputs are stored in a single format."}, "answer": "A", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "What is the \"whitelisting\" approach to input validation?", "q_vi": "Cách tiếp cận \"danh sách trắng\" để xác thực đầu vào là gì?", "options": {"A": "Defining a set of rules for what is not allowed (e.g., script tag).", "B": "Defining a set of rules for what is allowed, and rejecting everything else.", "C": "A list of users who are allowed to use the system.", "D": "Allowing all inputs except those from a known bad IP address."}, "answer": "B", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "Why is whitelisting generally considered a more secure strategy than blacklisting?", "q_vi": "Tại sao danh sách trắng thường được coi là một chiến lược an toàn hơn danh sách đen?", "options": {"A": "Blacklisting is much harder to program.", "B": "Whitelisting runs faster.", "C": "Attackers can often find new ways to bypass a blacklist, but it's much harder to bypass a strict whitelist.", "D": "Whitelisting can be performed on the client-side, while blacklisting cannot."}, "answer": "C", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "A web form uses JavaScript to check if an email is valid before the user clicks \"submit.\" This is...", "q_vi": "Biểu mẫu web sử dụng JavaScript để kiểm tra xem email có hợp lệ hay không trước khi người dùng nhấp vào \"gửi\". Đây là...", "options": {"A": "...all the validation that is needed for a secure application.", "B": "...a form of server-side validation.", "C": "...good for user experience, but insufficient for security.", "D": "...a bad practice that slows down the user's browser."}, "answer": "C", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "For security and data integrity, where must validation always be performed?", "q_vi": "Để bảo mật và toàn vẹn dữ liệu, việc xác thực luôn phải được thực hiện ở đâu?", "options": {"A": "On the client-side (in the browser).", "B": "On the server-side.", "C": "In the database, using triggers.", "D": "In a separate, dedicated validation microservice."}, "answer": "B", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "What is a \"regular expression\" (regex) commonly used for in validation?", "q_vi": "\"Biểu thức chính quy\" (regex) thường được sử dụng để xác thực là gì?", "options": {"A": "Encrypting the user's input before storing it.", "B": "Defining a pattern (e.g., for an email or phone number) that an input string must match.", "C": "Handling program crashes from bad input.", "D": "Refactoring complex code."}, "answer": "B", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "When a user's input fails validation, why is it often a bad security practice to give a detailed error message (e.g., \"Input is too long, must be 8 chars\")?", "q_vi": "Khi thông tin đầu vào của người dùng không được xác thực, tại sao việc đưa ra thông báo lỗi chi tiết thường là một biện pháp bảo mật kém (ví dụ: \"Đầu vào quá dài, phải có 8 ký tự\")?", "options": {"A": "It gives attackers clues about the validation rules, helping them find a way to bypass it.", "B": "It is too confusing for non-technical users.", "C": "It is too difficult to translate detailed errors into other languages.", "D": "It logs too much information to the server."}, "answer": "A", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "Why is it important to check that a numeric input (like 'age') is not an impossibly large number?", "q_vi": "Tại sao điều quan trọng là phải kiểm tra xem dữ liệu đầu vào dạng số (như 'tuổi') có phải là một số quá lớn không?", "options": {"A": "It wastes database storage space.", "B": "It is hard for humans to read.", "C": "It can cause a numeric overflow exception and crash the program.", "D": "It makes sorting the numbers very slow."}, "answer": "C", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "In addition to a range check (e.g., 0 < age < 120), what is another type of \"sensible value\" check for numbers?", "q_vi": "Ngoài việc kiểm tra phạm vi (ví dụ: 0 < tuổi < 120), một loại kiểm tra \"giá trị hợp lý\" khác cho các số là gì?", "options": {"A": "A check to see if the number is odd or even.", "B": "A check to convert the number to a string.", "C": "A consistency check (e.g., ensuring a new meter reading is higher than the previous one).", "D": "A check to see if the number is a prime number."}, "answer": "C", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "In many regex dialects, what does the $ (dollar sign) symbol mean when used at the end of an expression?", "q_vi": "Trong nhiều phương ngữ biểu thức chính quy, ký hiệu $ (ký hiệu đô la) có ý nghĩa gì khi được sử dụng ở cuối biểu thức?", "options": {"A": "The match must end at the end of the string.", "B": "The previous character is optional.", "C": "It matches a literal dollar sign.", "D": "It matches any single number."}, "answer": "A", "week": "Week03", "quiz": "Quiz01", "id": "Week03_Quiz01_Q10", "multi": false}, {"num": 1, "q_en": "What is the primary goal of failure management?", "q_vi": "Mục tiêu chính của quản lý sai sót là gì?", "options": {"A": "To guarantee that the program has zero bugs in every release before it reaches users.", "B": "To minimize the impact of failures on the user and prevent data loss.", "C": "To automatically identify, repair, and redeploy fixes for all bugs as soon as they are found.", "D": "To make the program run faster so users experience fewer delays and therefore fewer failures."}, "answer": "B", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q1", "multi": false}, {"num": 2, "q_en": "The principle of \"failing secure\" means that a program failure should...", "q_vi": "Nguyên tắc \"thất bại an toàn\" có nghĩa là một chương trình bị lỗi sẽ...", "options": {"A": "...never happen under any normal operating condition, regardless of inputs or environment.", "B": "...be hidden from the user so they are not alarmed and the system appears to continue normally.", "C": "...securely delete all user data immediately so no attacker can read it after the failure.", "D": "...never leave confidential data in an exposed or insecure state."}, "answer": "D", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q2", "multi": false}, {"num": 3, "q_en": "A program crashes because it tries to open a file that does not exist. This is best described as a...", "q_vi": "Chương trình gặp sự cố vì nó cố mở một tệp không tồn tại. Điều này được mô tả tốt nhất như một...", "options": {"A": "Program exception.", "B": "Data failure caused by invalid or corrupted input rather than the program's inability to continue.", "C": "Timing failure caused by the operation taking too long or completing in the wrong order.", "D": "Hardware failure caused by a physical storage device or network component malfunctioning."}, "answer": "A", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q3", "multi": false}, {"num": 4, "q_en": "When updating a bank database, you must (1) debit account A and (2) credit account B. What mechanism ensures that both steps complete, or neither does?", "q_vi": "Khi cập nhật cơ sở dữ liệu ngân hàng, bạn phải (1) ghi nợ tài khoản A và (2) ghi có tài khoản B. Cơ chế nào đảm bảo rằng cả hai bước đều hoàn thành hoặc không thực hiện cả hai bước?", "options": {"A": "An if-else block that checks each account balance and manually decides which assignment should run", "B": "A try-except block that catches any database error and then continues with the remaining step", "C": "An ACID Transaction", "D": "A regular expression used to validate the account numbers before either balance is changed"}, "answer": "C", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q4", "multi": false}, {"num": 5, "q_en": "What is the main purpose of an exception-handling mechanism like tr
