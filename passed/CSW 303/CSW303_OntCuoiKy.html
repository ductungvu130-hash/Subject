i": "Các mô hình dự đoán có xu hướng gặp khó khăn khi:", "options": {"A": "Requirements are stable.", "B": "System risk is low.", "C": "Requirements change frequently.", "D": "Projects demand extensive documentation."}, "answer": "C", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q8", "multi": false}, {"num": 9, "q_en": "What is a primary strength of predictive models:", "q_vi": "Điểm mạnh chính của mô hình dự đoán là gì:", "options": {"A": "High flexibility during development.", "B": "Early cost and schedule predictability.", "C": "Encouraging frequent requirement changes.", "D": "Avoiding all documentation."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q9", "multi": false}, {"num": 10, "q_en": "The Waterfall Model is commonly used in:", "q_vi": "Mô hình thác nước thường được sử dụng trong:", "options": {"A": "Projects with frequent change.", "B": "Regulated industries needing strict documentation.", "C": "Startups building experimental prototypes.", "D": "Rapid innovation environments."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q10", "multi": false}, {"num": 11, "q_en": "The IRS modernization failure highlights that Waterfall:", "q_vi": "Thất bại trong quá trình hiện đại hóa IRS nhấn mạnh rằng Thác nước:", "options": {"A": "Handles changing requirements well.", "B": "Relying on early requirements can be risky.", "C": "Eliminates the need for testing.", "D": "Always completes on schedule."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q11", "multi": false}, {"num": 12, "q_en": "Predictive models are MOST suitable when:", "q_vi": "Các mô hình dự đoán phù hợp NHẤT khi:", "options": {"A": "Stakeholders cannot define requirements.", "B": "The system must meet strict compliance standards.", "C": "The customer prefers high adaptability.", "D": "Requirements will evolve rapidly."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q12", "multi": false}, {"num": 13, "q_en": "A major disadvantage of predictive models is that they:", "q_vi": "Một nhược điểm lớn của các mô hình dự đoán là chúng:", "options": {"A": "Provide too much customer collaboration.", "B": "Lack flexibility for changing requirements.", "C": "Require too little documentation.", "D": "Rely heavily on working software early."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q13", "multi": false}, {"num": 14, "q_en": "In the Waterfall Model, testing occurs:", "q_vi": "Trong Mô hình Thác nước, quá trình thử nghiệm diễn ra:", "options": {"A": "Only after the implementation phase is complete.", "B": "Continuously throughout the project.", "C": "Before requirements gathering.", "D": "Before design is completed."}, "answer": "A", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q14", "multi": false}, {"num": 15, "q_en": "The Incremental Model is beneficial because it:", "q_vi": "Mô hình tăng dần có lợi vì nó:", "options": {"A": "Delivers value earlier than a single final release.", "B": "Avoids all planning.", "C": "Requires no customer interaction.", "D": "Eliminates need for testing."}, "answer": "A", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q15", "multi": false}, {"num": 16, "q_en": "The V-Model is preferred in domains where:", "q_vi": "Mô hình chữ V được ưu tiên trong các lĩnh vực:", "options": {"A": "Rapid prototyping is essential.", "B": "Safety and correctness are critical.", "C": "Frequent requirement changes occur.", "D": "Minimal documentation is acceptable."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q16", "multi": false}, {"num": 17, "q_en": "The main assumption behind predictive models is that:", "q_vi": "Giả định chính đằng sau các mô hình dự đoán là:", "options": {"A": "Requirements will evolve organically.", "B": "Requirements can be fully known early.", "C": "Customers prefer flexible processes.", "D": "Teams want minimal structure."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q17", "multi": false}, {"num": 18, "q_en": "A negative outcome of rigid sequential phases is:", "q_vi": "Một kết quả tiêu cực của các giai đoạn tuần tự cứng nhắc là:", "options": {"A": "Reduced clarity.", "B": "Increased adaptability.", "C": "Difficulty returning to earlier stages.", "D": "Better handling of change."}, "answer": "C", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q18", "multi": false}, {"num": 19, "q_en": "One key reason predictive models rely on documentation is to:", "q_vi": "Một lý do chính khiến các mô hình dự đoán dựa vào tài liệu là:", "options": {"A": "Remove the need for communication.", "B": "Ensure traceability and compliance.", "C": "Make coding unnecessary.", "D": "Allow spontaneous changes."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q19", "multi": false}, {"num": 20, "q_en": "When using Waterfall, customers typically see the working product:", "q_vi": "Khi sử dụng Waterfall, khách hàng thường thấy sản phẩm đang hoạt động:", "options": {"A": "Very early.", "B": "Only near the end.", "C": "After each daily iteration.", "D": "At the start of each sprint."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q20", "multi": false}, {"num": 21, "q_en": "Predictive planning involves:", "q_vi": "Lập kế hoạch dự đoán bao gồm:", "options": {"A": "Planning only small increments at a time.", "B": "Deferring planning until after coding begins.", "C": "Establishing detailed schedules early.", "D": "Adjusting plans continuously."}, "answer": "C", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q21", "multi": false}, {"num": 22, "q_en": "Which project is LEAST suited for predictive models:", "q_vi": "Dự án nào ÍT PHÙ HỢP NHẤT cho các mô hình dự đoán:", "options": {"A": "A startup app exploring uncertain features.", "B": "Hospital patient records system.", "C": "Banking compliance platform.", "D": "Government defense control software."}, "answer": "A", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q22", "multi": false}, {"num": 23, "q_en": "The biggest challenge predictive models face is:", "q_vi": "Thách thức lớn nhất mà các mô hình dự đoán phải đối mặt là:", "options": {"A": "Handling volatile requirements.", "B": "Creating documentation.", "C": "Managing test cycles.", "D": "Organizing teams."}, "answer": "A", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q23", "multi": false}, {"num": 24, "q_en": "The core philosophy of predictive models is:", "q_vi": "Triết lý cốt lõi của các mô hình dự đoán là:", "options": {"A": "Responding to change over following a plan.", "B": "Building working software before defining requirements.", "C": "Planning thoroughly before development begins.", "D": "Prioritizing collaboration over documentation."}, "answer": "C", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q24", "multi": false}, {"num": 1, "q_en": "Adaptive models are designed to:", "q_vi": "Các mô hình thích ứng được thiết kế để:", "options": {"A": "Prevent requirement changes.", "B": "Accommodate evolving requirements.", "C": "Replace communication with documentation.", "D": "Use no iterations."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q1", "multi": false}, {"num": 2, "q_en": "A key characteristic of adaptive processes is:", "q_vi": "Đặc điểm chính của quá trình thích ứng là:", "options": {"A": "Strict phase gating.", "B": "Detailed upfront planning.", "C": "Iterative and feedback-driven development.", "D": "Heavy documentation focus."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q2", "multi": false}, {"num": 3, "q_en": "Which statement best describes the Product Backlog in Scrum:", "q_vi": "Câu nào mô tả đúng nhất về Product Backlog trong Scrum:", "options": {"A": "A living, prioritized list of everything needed in the product.", "B": "A fixed contract signed at project start.", "C": "A list of tasks for developers to complete daily.", "D": "A complete design document."}, "answer": "A", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q3", "multi": false}, {"num": 4, "q_en": "The Sprint Backlog is BEST described as:", "q_vi": "Sprint Backlog được mô tả TỐT NHẤT là:", "options": {"A": "The set of Product Backlog items selected for the current sprint.", "B": "A list of all work in the entire project.", "C": "A document controlled only by the Product Owner.", "D": "A high-level requirement specification."}, "answer": "A", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q4", "multi": false}, {"num": 5, "q_en": "The Spiral Model primarily focuses on:", "q_vi": "Mô hình xoắn ốc chủ yếu tập trung vào:", "options": {"A": "Eliminating all project risks.", "B": "Risk-driven development cycles.", "C": "Minimizing customer involvement.", "D": "Rapid, unstructured delivery."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q5", "multi": false}, {"num": 6, "q_en": "RUP (Rational Unified Process) is best described as:", "q_vi": "RUP (Quy trình hợp nhất hợp lý) được mô tả tốt nhất là:", "options": {"A": "A pure predictive model.", "B": "A purely adaptive model with no structure.", "C": "A structured yet iterative framework.", "D": "A model that eliminates documentation."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q6", "multi": false}, {"num": 7, "q_en": "Agile was created because developers were frustrated with:", "q_vi": "Agile được tạo ra vì các nhà phát triển cảm thấy thất vọng với:", "options": {"A": "Too much customer feedback.", "B": "Heavy, rigid, inefficient processes.", "C": "Insufficient documentation.", "D": "Lack of automated tools."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q7", "multi": false}, {"num": 8, "q_en": "The Agile Manifesto emphasizes:", "q_vi": "Tuyên ngôn Agile nhấn mạnh:", "options": {"A": "Following a fixed plan.", "B": "Maximizing documentation.", "C": "Individuals and interactions.", "D": "Minimizing customer collaboration."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q8", "multi": false}, {"num": 9, "q_en": "Which Agile value focuses on prioritizing customer needs:", "q_vi": "Giá trị Agile nào tập trung vào việc ưu tiên nhu cầu của khách hàng:", "options": {"A": "Responding to change over following a plan.", "B": "Working software over comprehensive documentation.", "C": "Customer collaboration over contract negotiation.", "D": "Individuals and interactions over processes and tools."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q9", "multi": false}, {"num": 10, "q_en": "A key principle of Agile is:", "q_vi": "Nguyên tắc then chốt của Agile là:", "options": {"A": "Delivering software only once at the end.", "B": "Avoiding iterative development.", "C": "Welcoming changing requirements.", "D": "Releasing no working software until the entire project is finished."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q10", "multi": false}, {"num": 11, "q_en": "Scrum is best described as:", "q_vi": "Scrum được mô tả tốt nhất là:", "options": {"A": "A rigid sequential methodology.", "B": "A lightweight Agile framework.", "C": "A predictive project management tool.", "D": "A design-only technique."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q11", "multi": false}, {"num": 12, "q_en": "The Product Owner is primarily responsible for:", "q_vi": "Chủ sản phẩm chịu trách nhiệm chính về:", "options": {"A": "Removing team obstacles.", "B": "Writing all code.", "C": "Managing and prioritizing the Product Backlog.", "D": "Conducting the Daily Scrum."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q12", "multi": false}, {"num": 13, "q_en": "The Scrum Master's core responsibility is to:", "q_vi": "Trách nhiệm cốt lõi của Scrum Master là:", "options": {"A": "Prioritize backlog items.", "B": "Facilitate Scrum practices and remove blockers.", "C": "Approve design decisions.", "D": "Write user stories."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q13", "multi": false}, {"num": 14, "q_en": "The Development Team in Scrum is:", "q_vi": "Nhóm phát triển trong Scrum là:", "options": {"A": "Self-managing and cross-functional.", "B": "Strictly controlled by the Scrum Master.", "C": "Not allowed to collaborate.", "D": "Forbidden from talking to the Product Owner."}, "answer": "A", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q14", "multi": false}, {"num": 15, "q_en": "Each Sprint produces:", "q_vi": "Mỗi ​​Sprint tạo ra:", "options": {"A": "A fully completed project.", "B": "A user manual.", "C": "A potentially shippable product increment.", "D": "A complete design document."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q15", "multi": false}, {"num": 16, "q_en": "The Daily Scrum is intended to:", "q_vi": "Daily Scrum nhằm mục đích:", "options": {"A": "Report to the Scrum Master.", "B": "Identify progress and blockers.", "C": "Review the entire project.", "D": "Conduct testing activities."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q16", "multi": false}, {"num": 17, "q_en": "The Sprint Review focuses on:", "q_vi": "Buổi đánh giá Sprint tập trung vào:", "options": {"A": "Reflecting on team performance.", "B": "Demonstrating the increment and gathering feedback.", "C": "Planning the next sprint.", "D": "Estimating user stories."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q17", "multi": false}, {"num": 18, "q_en": "The Sprint Retrospective focuses on:", "q_vi": "Buổi Cải tiến Sprint tập trung vào:", "options": {"A": "Showing the increment.", "B": "Reviewing the Product Backlog.", "C": "Identifying process improvements.", "D": "Finalizing the product release."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q18", "multi": false}, {"num": 19, "q_en": "Kanban is best described as:", "q_vi": "Kanban được mô tả tốt nhất là:", "options": {"A": "A time-boxed Agile framework.", "B": "A continuous flow method visualizing work.", "C": "A predictive model.", "D": "A debugging technique."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q19", "multi": false}, {"num": 20, "q_en": "Extreme Programming (XP) emphasizes:", "q_vi": "Lập trình cực đoan (XP) nhấn mạnh:", "options": {"A": "Heavy documentation.", "B": "Individual contributors working alone.", "C": "Technical excellence such as TDD and pair programming.", "D": "Waterfall-style delivery."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q20", "multi": false}, {"num": 21, "q_en": "Lean Software Development focuses on:", "q_vi": "Phát triển phần mềm tinh gọn tập trung vào:", "options": {"A": "Adding extra steps to ensure safety.", "B": "Eliminating waste and delivering fast.", "C": "Avoiding customer involvement.", "D": "Maximizing documentation."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q21", "multi": false}, {"num": 22, "q_en": "FDD (Feature-Driven Development) is especially suited for:", "q_vi": "FDD (Phát triển theo hướng tính năng) đặc biệt phù hợp với:", "options": {"A": "Small, uncertain prototypes.", "B": "Very large, domain-rich systems.", "C": "Systems with no clear features.", "D": "Teams that avoid documentation."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q22", "multi": false}, {"num": 23, "q_en": "Scaled Agile Frameworks (e.g., SAFe) exist because:", "q_vi": "Khung Agile có quy mô (ví dụ: SAFe) tồn tại vì:", "options": {"A": "Agile cannot work in any organization.", "B": "Large enterprises need coordination across many teams.", "C": "Agile requires minimal planning.", "D": "Predictive models scale automatically."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q23", "multi": false}, {"num": 24, "q_en": "Which scenario BEST suits Agile:", "q_vi": "Kịch bản nào phù hợp nhất với Agile:", "options": {"A": "Government defense system with strict compliance.", "B": "Building a medical device requiring formal approvals.", "C": "A startup building a new social media app.", "D": "Financial reporting software with fixed requirements."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q24", "multi": false}, {"num": 25, "q_en": "Agile welcomes changing requirements because:", "q_vi": "Agile hoan nghênh các yêu cầu thay đổi vì:", "options": {"A": "It avoids planning.", "B": "Customers never know what they want.", "C": "Feedback-driven iterations improve product alignment.", "D": "Documentation is not important."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q25", "multi": false}, {"num": 26, "q_en": "The core unit of work in Scrum is:", "q_vi": "Đơn vị công việc cốt lõi trong Scrum là:", "options": {"A": "The requirement document.", "B": "The Sprint.", "C": "The Gantt chart.", "D": "The phase gate."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q26", "multi": false}, {"num": 27, "q_en": "A major advantage of Agile over predictive models is:", "q_vi": "Ưu điểm chính của Agile so với các mô hình dự đoán là:", "options": {"A": "It eliminates testing.", "B": "It adapts to change more easily.", "C": "It requires no planning.", "D": "It guarantees early cost accuracy."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q27", "multi": false}, {"num": 28, "q_en": "Scrum teams should be:", "q_vi": "Nhóm Scrum nên:", "options": {"A": "Large with specialized roles.", "B": "Self-organizing with cross-functional skills.", "C": "Managed hierarchically with command-style control.", "D": "Focused mainly on documentation."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q28", "multi": false}, {"num": 29, "q_en": "A Scrum Sprint is typically:", "q_vi": "Scrum Sprint thường là:", "options": {"A": "A flexible time period that changes weekly.", "B": "A fixed-length iteration with clear goals.", "C": "A continuous flow of work.", "D": "A meeting with stakeholders."}, "answer": "B", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q29", "multi": false}, {"num": 30, "q_en": "The Agile mindset is fundamentally about:", "q_vi": "Tư duy Agile về cơ bản là về:", "options": {"A": "Following strict rules.", "B": "Avoiding planning.", "C": "Embracing learning and change.", "D": "Reducing team collaboration."}, "answer": "C", "week": "Week07", "quiz": "Quiz03", "id": "Week07_Quiz03_Q30", "multi": false}, {"num": 1, "q_en": "When creating a persona to represent a product user, what is the primary purpose of including personal details like a name, age, and photograph?", "q_vi": "Khi tạo nhân vật đại diện cho người dùng sản phẩm, mục đích chính của việc bao gồm các chi tiết cá nhân như tên, tuổi và ảnh là gì?", "options": {"A": "To ensure the development team can perform a background check on the user type.", "B": "To create a realistic character that helps the team empathize with the user (\"step into their shoes\").", "C": "To meet the legal requirements for user documentation.", "D": "To define the specific salary bracket for pricing the software."}, "answer": "B", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "Which of the following is the most effective element to include in a persona description to help developers judge UI complexity?", "q_vi": "Yếu tố nào sau đây là yếu tố hiệu quả nhất để đưa vào mô tả cá nhân nhằm giúp nhà phát triển đánh giá độ phức tạp của giao diện người dùng?", "options": {"A": "The user's long-term life goals (e.g., \"wants to retire early\").", "B": "The user's educational background and technical skill level.", "C": "The user's favorite color scheme.", "D": "The user's manager's name."}, "answer": "B", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "Why is it generally advised to avoid focusing on \"user goals\" (e.g., \"career progression\") when writing personas?", "q_vi": "Tại sao người ta thường khuyên nên tránh tập trung vào \"user goals\" (ví dụ: \"career progression\") khi viết cá tính?", "options": {"A": "Users never have goals when using software.", "B": "Goals are too broad and often do not directly relate to why a user needs a specific piece of software to get through their day.", "C": "Goals are always financial and irrelevant to functionality.", "D": "It is impossible to write a goal in less than three paragraphs."}, "answer": "B", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "You are developing a new product and have very little data. You create \"proto-personas\" based on the team's best guesses. What is the limitation of this approach?", "q_vi": "Bạn đang phát triển một sản phẩm mới và có rất ít dữ liệu. Bạn tạo \"proto-personas\" dựa trên những dự đoán tốt nhất của nhóm. Hạn chế của phương pháp này là gì?", "options": {"A": "They are too detailed to be useful.", "B": "They cannot be used to write scenarios.", "C": "They are not as accurate as those based on user research, though they still provide a shared team vision.", "D": "They require legal approval before use."}, "answer": "C", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "How many personas should you typically create to identify the key features of a system effectively?", "q_vi": "Bạn thường nên tạo bao nhiêu nhân vật để xác định các tính năng chính của hệ thống một cách hiệu quả?", "options": {"A": "One for every potential user of the system.", "B": "At least 20 to cover every possible demographic.", "C": "A small number (e.g., up to 5) to avoid overlapping requirements and confusion.", "D": "Only one \"average\" persona."}, "answer": "C", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "Which of the following best describes the correct \"level of detail\" for a starting scenario?", "q_vi": "Câu nào sau đây mô tả đúng nhất \"level of detail\" cho kịch bản bắt đầu?", "options": {"A": "A strict, step-by-step list of every mouse click and keystroke.", "B": "A high-level narrative describing a user's problem and an imagined solution without technical specification.", "C": "A complete code-level specification of the feature.", "D": "A vague statement saying \"the user solves the problem\" with no description of how."}, "answer": "B", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "When writing a scenario, why might you include specific technical details (like \"Log in with Google\") rather than a generic phrase (like \"User performs authentication\")?", "q_vi": "Khi viết kịch bản, tại sao bạn có thể đưa vào các chi tiết kỹ thuật cụ thể (như \"Log in with Google\") thay vì một cụm từ chung chung (như \"User performs authentication\")?", "options": {"A": "Because generic phrases can be confusing, while specific examples are often easier for users and developers to understand.", "B": "Because you are required to use Google products.", "C": "Because the code has already been written.", "D": "Because scenarios must always dictate the final implementation database."}, "answer": "A", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "What is the primary advantage of using a \"narrative\" style (natural language) for scenarios over a \"structured\" style (fields and flowcharts)?", "q_vi": "Ưu điểm chính của việc sử dụng kiểu \"narrative\" (ngôn ngữ tự nhiên) cho các kịch bản so với kiểu \"structured\" (trường và sơ đồ) là gì?", "options": {"A": "Narrative scenarios are machine-readable.", "B": "Narrative scenarios are accessible and understandable to non-technical users and stakeholders.", "C": "Structured scenarios are too short.", "D": "Narrative scenarios are legally binding contracts."}, "answer": "B", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "Which action should you take to identify software features from a written scenario?", "q_vi": "Bạn nên thực hiện hành động nào để xác định các tính năng phần mềm từ một kịch bản bằng văn bản?", "options": {"A": "Count the number of adjectives used.", "B": "Highlight the \"active verbs\" (actions) in the text to see what the user is doing (e.g., \"upload,\" \"share\").", "C": "Rewrite the scenario in a different language.", "D": "Remove all references to the persona."}, "answer": "B", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "A scenario describes a teacher using a tool to organize a class trip. What represents the \"Problem\" element of this scenario?", "q_vi": "Một tình huống mô tả một giáo viên sử dụng một công cụ để tổ chức một chuyến tham quan cho lớp. Điều gì đại diện cho phần tử \"Problem\" của kịch bản này?", "options": {"A": "The teacher logs in.", "B": "The teacher wants to share photos but needs to ensure student privacy and copyright compliance.", "C": "The teacher has a degree in History.", "D": "The system sends an email."}, "answer": "B", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q10", "multi": false}, {"num": 11, "q_en": "Scenarios are described as \"tools for thinking.\" What does this imply about their completeness?", "q_vi": "Các kịch bản được mô tả là \"tools for thinking.\" Điều này ngụ ý gì về tính đầy đủ của chúng?", "options": {"A": "They must cover every single edge case and error state.", "B": "They must be perfect before any coding begins.", "C": "They do not have to be complete or consistent; their job is to stimulate design creativity.", "D": "They replace the need for testing."}, "answer": "C", "week": "Week08", "quiz": "Quiz01", "id": "Week08_Quiz01_Q11", "mul const WC={Week01:'#58a6ff',Week02:'#3fb950',Week03:'#f0883e',Week04:'#a371f7',

/* ── helpers ── */
function esc(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Detect if text has code-like content and wrap appropriately
function fmtQ(raw){
  if(!raw) return '';
  // Split on newlines; lines that look like code get code-block treatment
  // Strategy: find runs of non-prose lines (indented / starting with def/return/assert/Block etc.)
  const lines = raw.split('\n');
  let out = '';
  let codeBuf = [];
  
  const isCodeLike = l => {
    const t = l; // keep original indent
    return /^\s+(def |return |assert |result |numbers|text |a |b )/.test(t)
        || /^(def |return |assert |import |class |Block [A-C]$)/.test(t.trim())
        || /^Block [A-C]$/.test(t.trim());
  };
  
  const flushCode = () => {
    if(codeBuf.length){
      out += '<span class="code-block">'+esc(codeBuf.join('\n'))+'</span>';
      codeBuf=[];
    }
  };
  
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(isCodeLike(l)){
      codeBuf.push(l);
    } else {
      flushCode();
      if(l.trim()) out += esc(l)+'\n';
      else if(i>0 && i<lines.length-1) out += '\n';
    }
  }
  flushCode();
  return out.trim();
}

/* ── Sidebar ── */
function buildSidebar(){
  const nav=document.getElementById('sbNav');
  const wks={};
  QS.forEach(q=>{
    if(!wks[q.week]) wks[q.week]={};
    if(!wks[q.week][q.quiz]) wks[q.week][q.quiz]=0;
    wks[q.week][q.quiz]++;
  });
  Object.keys(wks).sort().forEach(w=>{
    const qzs=wks[w], tot=Object.values(qzs).reduce((a,b)=>a+b,0);
    const c=WC[w]||'#58a6ff';
    const sec=document.createElement('div'); sec.className='nav-sec';
    const hdr=document.createElement('div'); hdr.className='wk-hdr';
    hdr.innerHTML=`<div class="wk-dot" style="background:${c}"></div>
      <span class="wk-name">${WT[w]||w}</span>
      <span class="wk-cnt">${tot}</span><span class="wk-chev">▶</span>`;
    const qzEl=document.createElement('div'); qzEl.className='wk-quizzes';
    hdr.onclick=()=>{hdr.classList.toggle('open');qzEl.classList.toggle('open')};

    const allB=document.createElement('button'); allB.className='qz-btn';
    allB.textContent=`Tất cả (${tot} câu)`;
    allB.onclick=()=>pickSet(QS.filter(q=>q.week===w), WT[w]||w, allB);
    qzEl.appendChild(allB);

    Object.keys(qzs).sort().forEach(qz=>{
      const b=document.createElement('button'); b.className='qz-btn';
      b.textContent=`${qz} (${qzs[qz]} câu)`;
      b.onclick=()=>pickSet(QS.filter(q=>q.week===w&&q.quiz===qz),`${WT[w]} · ${qz}`,b);
      qzEl.appendChild(b);
    });
    sec.appendChild(hdr); sec.appendChild(qzEl); nav.appendChild(sec);
  });
}

function pickSet(qs,label,btn){
  document.querySelectorAll('.qz-btn').forEach(b=>b.classList.remove('sel'));
  if(btn) btn.classList.add('sel');
  loadSet(qs,label);
}

function loadSet(qs,label){
  curQs=qs; idx=0; score={c:0,w:0}; answered=false;
  document.getElementById('tbTitle').textContent=label;
  document.getElementById('tbSub').textContent=`${qs.length} câu hỏi`;
  document.getElementById('modeTabs').style.display='flex';
  setMode('quiz');
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.m-tab').forEach(t=>t.classList.toggle('active',t.dataset.m===m));
  m==='quiz'?renderQuiz():renderReview();
}

/* ── Quiz ── */
function renderQuiz(){
  if(idx>=curQs.length){renderResults();return}
  const q=curQs[idx], tot=curQs.length, pct=Math.round(idx/tot*100);
  const vi=showVI?'show-vi':'';
  const isMulti=q.multi;
  const letters=Object.keys(q.options).sort();
  
  let optsH='';
  letters.forEach(lt=>{
    optsH+=`<button class="opt-btn" id="ob_${lt}" onclick="pick('${lt}')">
      <span class="opt-let">${lt}</span>
      <span style="flex:1;padding-top:2px">${esc(q.options[lt])}</span>
    </button>`;
  });
  
  const multiNote = isMulti
    ? `<span class="multi-badge">✦ Nhiều đáp án đúng</span>` : '';

  document.getElementById('cnt').innerHTML=`
    <div class="qhdr fi">
      <span class="qprog-num">${idx+1} / ${tot}</span>
      <div class="qprog-bar"><div class="qprog-fill" style="width:${pct}%"></div></div>
      <div class="q-score"><span class="sc">✓ ${score.c}</span><span class="sw2">✗ ${score.w}</span></div>
    </div>
    <div class="qcard fi ${vi}" id="qcard">
      <div class="q-meta">
        <span class="qbadge">${q.week.replace('Week','W')} · ${q.quiz}</span>
        <span class="qbadge">Q${q.num}</span>
        ${multiNote}
      </div>
      <div class="qt">${fmtQ(q.q_en)}</div>
      <div class="qt-vi">${esc(q.q_vi||'')}</div>
      <div class="opts" id="opts">${optsH}</div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="q-actions">
      <button class="btn btn-s" onclick="skipQ()">⟩ Bỏ qua</button>
      <button class="btn btn-p" id="nxtBtn" onclick="nextQ()" disabled>Câu tiếp theo ⟩</button>
    </div>`;
  answered=false;
}

function pick(lt){
  if(answered) return;
  answered=true;
  const q=curQs[idx];
  const corrects=q.answer.split(',');  // e.g. ['A'] or ['A','B']
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  const isOk=corrects.includes(lt);
  document.getElementById('ob_'+lt).classList.add(isOk?'correct':'wrong');
  if(!isOk) corrects.forEach(c=>{
    const el=document.getElementById('ob_'+c);
    if(el) el.classList.add('reveal');
  });
  if(isOk){score.c++;prog[q.id]='c'} else {score.w++;prog[q.id]='w'}
  const fb=document.getElementById('fb');
  if(q.multi){
    fb.className='fb show info';
    fb.innerHTML=`✦ Câu có nhiều đáp án đúng: <strong>${q.answer}</strong>`;
  } else if(isOk){
    fb.className='fb show ok'; fb.innerHTML='✓ Chính xác!';
  } else {
    fb.className='fb show ng'; fb.innerHTML=`✗ Sai. Đáp án đúng: <strong>${q.answer}</strong>`;
  }
  document.getElementById('nxtBtn').disabled=false;
}

function skipQ(){
  if(!answered){
    const q=curQs[idx];
    const corrects=q.answer.split(',');
    document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
    corrects.forEach(c=>{const el=document.getElementById('ob_'+c);if(el)el.classList.add('reveal')});
    const fb=document.getElementById('fb');
    fb.className='fb show ng'; fb.innerHTML=`Đáp án: <strong>${q.answer}</strong>`;
    document.getElementById('nxtBtn').disabled=false;
    answered=true;
  } else nextQ();
}
function nextQ(){idx++;renderQuiz()}

function renderResults(){
  const tot=curQs.length, pct=Math.round(score.c/tot*100);
  const col=pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)';
  const msg=pct>=90?'🎉 Xuất sắc!':pct>=75?'👍 Tốt lắm!':pct>=60?'📚 Cần ôn thêm':'💪 Cố lên nào!';
  document.getElementById('cnt').innerHTML=`<div class="fi">
    <div class="res-card">
      <div class="res-pct" style="color:${col}">${pct}%</div>
      <div class="res-lbl">${msg} · Hoàn thành ${tot} câu</div>
      <div class="res-stats">
        <div><div class="rs-n" style="color:var(--green)">${score.c}</div><div class="rs-l">Đúng</div></div>
        <div><div class="rs-n" style="color:var(--red)">${score.w}</div><div class="rs-l">Sai</div></div>
        <div><div class="rs-n">${tot}</div><div class="rs-l">Tổng</div></div>
      </div>
      <div class="res-acts">
        <button class="btn btn-p" onclick="restart()">↺ Làm lại</button>
        <button class="btn btn-s" onclick="setMode('review')">📖 Xem đáp án</button>
        <button class="btn btn-s" onclick="showHome()">⌂ Trang chủ</button>
      </div>
    </div></div>`;
}
function restart(){idx=0;score={c:0,w:0};renderQuiz()}

function buildRvList(){
  const src=(document.getElementById('rvSrc')?.value||'').toLowerCase();
  let qs=curQs;
  if(src) qs=qs.filter(q=>q.q_en.toLowerCase().includes(src)||(q.q_vi&&q.q_vi.toLowerCase().includes(src))||Object.values(q.options).some(o=>o.toLowerCase().includes(src)));
  document.getElementById('rvCnt').textContent=`${qs.length} câu`;
  const vi=showVI?'show-vi':'';
  const list=document.getElementById('rvList');
  if(!list) return;
  list.className=`rv-list ${vi}`;
  if(!qs.length){list.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">Không tìm thấy</div>';return}
  let h='';
  qs.forEach((q,i)=>{
    const corrects=q.answer.split(',');
    let optsH='';
    Object.keys(q.options).sort().forEach(lt=>{
      optsH+=`<div class="rv-opt ${corrects.includes(lt)?'ok':'ng'}">
        <span class="rv-opt-l">${lt}.</span>
        <span>${esc(q.options[lt])}</span>
        ${corrects.includes(lt)?'<span style="margin-left:auto;font-weight:700">✓</span>':''}
      </div>`;
    });
    h+=`<div class="rv-item" id="ri${i}">
      <div class="rv-q" onclick="togRv(${i})">
        <span class="rv-num">${q.week.replace('Week','W')}·${q.quiz}·Q${q.num}</span>
        <div class="rv-q-txt">
          <div class="rv-q-en">${fmtQ(q.q_en)}</div>
          <div class="rv-q-vi">${esc(q.q_vi||'')}</div>
        </div>
        <span class="rv-chev">▾</span>
      </div>
      <div class="rv-ans"><div class="rv-opts">${optsH}</div></div>
    </div>`;
  });
  list.innerHTML=h;
}
function togRv(i){document.getElementById('ri'+i)?.classList.toggle('open')}
function filterRv(){rvSearch=document.getElementById('rvSrc')?.value||'';buildRvList()}

/* ── Lang ── */
function onLang(){
  showVI=document.getElementById('langChk').checked;
  const vi=showVI?'show-vi':'';
  document.getElementById('qcard')?.classList.toggle('show-vi',showVI);
  const l=document.getElementById('rvList');
  if(l) l.className=`rv-list ${vi}`;
}

buildSidebar();
showHome();
</script>
