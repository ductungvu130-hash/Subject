y-except?", "q_vi": "Mục đích chính của cơ chế xử lý ngoại lệ như thử ngoại trừ là gì?", "options": {"A": "To \"catch\" runtime errors and transfer control to a special block of code for graceful cleanup.", "B": "To validate user input before it is processed so invalid form values never reach the main code path during execution.", "C": "To prevent errors from ever happening in the first place by blocking every possible runtime fault before execution begins.", "D": "To automatically repair the underlying bug, rebuild the program, and retry the failed operation without developer involvement."}, "answer": "A", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q5", "multi": false}, {"num": 6, "q_en": "If a function catches an exception, performs a local cleanup (like closing a file), and then re-raises the exception, why would it do this?", "q_vi": "Nếu một hàm bắt được một ngoại lệ, thực hiện việc dọn dẹp cục bộ (chẳng hạn như đóng một tệp) rồi tái hiện ngoại lệ, thì tại sao nó lại làm như vậy?", "options": {"A": "To log the exception to the console twice.", "B": "To crash the program intentionally.", "C": "To allow a higher-level (calling) function to also handle the exception.", "D": "To prove to the compiler that the exception was caught and therefore no higher-level error handling is needed."}, "answer": "C", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q6", "multi": false}, {"num": 7, "q_en": "What are two common mechanisms to help a user recover work after a program crash?", "q_vi": "Hai cơ chế phổ biến giúp người dùng khôi phục công việc sau khi chương trình gặp sự cố là gì?", "options": {"A": "Auto-save and Activity logging.", "B": "Error messages and Pop-up alerts that notify the user about the crash and describe what may have happened.", "C": "Unit testing and Integration testing performed during development to reduce defects before the application is released.", "D": "Whitelisting and Blacklisting used to control which inputs, addresses, or actions are allowed by the system."}, "answer": "A", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q7", "multi": false}, {"num": 8, "q_en": "Why do external web APIs typically return numeric error codes (like HTTP 404 or 500) instead of language-specific exceptions?", "q_vi": "Tại sao API web bên ngoài thường trả về mã lỗi dạng số (như HTTP 404 hoặc 500) thay vì các ngoại lệ dành riêng cho ngôn ngữ?", "options": {"A": "The API and the calling program may be written in different, incompatible programming languages.", "B": "Numbers are faster to send over the internet because they use less bandwidth than descriptive messages or exception objects.", "C": "Numeric codes are more secure because attackers cannot intercept, read, or understand short numerical responses during communication.", "D": "It is a tradition that has no real technical purpose."}, "answer": "A", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q8", "multi": false}, {"num": 9, "q_en": "What is the simplest way to prevent your application from hanging forever if an external API call never responds?", "q_vi": "Cách đơn giản nhất để ngăn ứng dụng của bạn bị treo vĩnh viễn nếu lệnh gọi API bên ngoài không bao giờ phản hồi là gì?", "options": {"A": "Use a timeout mechanism.", "B": "Restart the server before making each request so any stuck connection is cleared ahead of time.", "C": "Send the request again immediately.", "D": "Call a different API whenever the first service is slow, even if it provides unrelated data."}, "answer": "A", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q9", "multi": false}, {"num": 10, "q_en": "What design pattern is used to handle a repeatedly failing external service by \"tripping\" and temporarily blocking all new requests to it?", "q_vi": "Mẫu thiết kế nào được sử dụng để xử lý một dịch vụ bên ngoài liên tục bị lỗi do \"ngắt\" và tạm thời chặn tất cả các yêu cầu mới đối với dịch vụ đó?", "options": {"A": "The Circuit Breaker Pattern", "B": "The Observer Pattern, which lets objects subscribe to notifications when another object changes", "C": "The Facade Pattern", "D": "The Transaction Pattern, which groups operations so they commit together or roll back as a unit"}, "answer": "A", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q10", "multi": false}, {"num": 11, "q_en": "What is the purpose of an assert statement?", "q_vi": "Mục đích của câu \"assert\" là gì?", "options": {"A": "To handle a known program exception, like try-catch, and recover gracefully from expected runtime errors.", "B": "To validate user input from a form before the program accepts the values and continues processing.", "C": "To check if a condition is true (as a \"sanity check\") and raise an error if it's false.", "D": "To print a debug message to the console whenever a developer wants to inspect a variable value."}, "answer": "C", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q11", "multi": false}, {"num": 12, "q_en": "When your program has an unrecoverable internal crash, what is the best practice for the message shown to the user?", "q_vi": "Khi chương trình của bạn gặp sự cố nội bộ không thể khôi phục, cách tốt nhất để xử lý thông báo hiển thị cho người dùng là gì?", "options": {"A": "A detailed technical error log (e.g., \"NullPointerException at line 42\") with stack-trace details for debugging.", "B": "A simple, non-technical message (e.g., \"An unexpected error occurred\").", "C": "No message at all (just close the application) so the user is not interrupted by confusing information.", "D": "A message blaming the user for the error and instructing them to avoid causing the crash again."}, "answer": "B", "week": "Week03", "quiz": "Quiz02", "id": "Week03_Quiz02_Q12", "multi": false}, {"num": 1, "q_en": "What is the primary goal of defining a software architecture?", "q_vi": "Mục tiêu chính của việc xác định kiến ​​trúc phần mềm là gì?", "options": {"A": "To choose the specific programming language, database engine, and low-level library stack before understanding the wider structure.", "B": "To document the system's high-level structure and component interactions.", "C": "To write the first modules of code for the application.", "D": "To finalize the user interface (UI) design, visual style, and branding before clarifying system responsibilities."}, "answer": "B", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "A software system's quality attributes (like performance, reliability, and security) are also known as:", "q_vi": "Các thuộc tính chất lượng của hệ thống phần mềm (như hiệu suất, độ tin cậy và bảo mật) còn được gọi là:", "options": {"A": "Detailed functional features requested by end users", "B": "Non-functional requirements", "C": "Business goals", "D": "User stories"}, "answer": "B", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "A non-functional requirement states, \"The system must be able to handle a 10x increase in user traffic over one year.\" This requirement directly influences which quality attribute?", "q_vi": "Yêu cầu phi chức năng nêu rõ: \"Hệ thống phải có khả năng xử lý lưu lượng người dùng tăng gấp 10 lần trong một năm.\" Yêu cầu này ảnh hưởng trực tiếp đến thuộc tính chất lượng nào?", "options": {"A": "Usability of the product interface during normal navigation", "B": "Security against unauthorized access and data leaks", "C": "Scalability", "D": "Maintainability"}, "answer": "C", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "Why is it critically important to get the architecture right early in the project?", "q_vi": "Tại sao việc sớm có được kiến ​​trúc phù hợp trong dự án lại cực kỳ quan trọng?", "options": {"A": "Because good architecture is cheap and easy to implement once the team selects modern frameworks and tools.", "B": "Because poor architectural decisions are extremely difficult and expensive to change later.", "C": "Because the architecture determines the final price of the product without needing further market or user analysis.", "D": "Because the first design is always the best one when created before coding begins and should not be revisited later."}, "answer": "B", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "(Scenario) A company builds an e-commerce site. As it becomes popular, the site crashes during sales. This system is failing which quality attribute?", "q_vi": "(Kịch bản) Một công ty xây dựng một trang web thương mại điện tử. Khi nó trở nên phổ biến, trang web gặp sự cố trong quá trình bán hàng. Hệ thống này đang bị lỗi thuộc tính chất lượng nào?", "options": {"A": "Scalability", "B": "Usability of the product navigation and checkout screens", "C": "Security", "D": "Maintainability"}, "answer": "A", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "Which quality attribute refers to the ease with which developers can fix bugs or add new features?", "q_vi": "Thuộc tính chất lượng nào đề cập đến việc nhà phát triển có thể dễ dàng sửa lỗi hoặc thêm các tính năng mới?", "options": {"A": "Performance of request processing under heavy load", "B": "Resilience during partial infrastructure failure", "C": "Maintainability", "D": "Availability"}, "answer": "C", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "The process of architectural design is best described as:", "q_vi": "Quá trình thiết kế kiến ​​trúc được mô tả tốt nhất như sau:", "options": {"A": "A series of trade-offs to balance conflicting goals", "B": "A fixed checklist of components to include regardless of project goals, constraints, and quality attribute priorities", "C": "A task only for the most senior developer", "D": "A final step completed just before release"}, "answer": "A", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "What is the most common trade-off when implementing very strict and complex security measures?", "q_vi": "Sự đánh đổi phổ biến nhất khi thực hiện các biện pháp bảo mật rất nghiêm ngặt và phức tạp là gì?", "options": {"A": "The system becomes less maintainable because every security rule automatically makes all future code changes unsafe.", "B": "The system's performance improves because encryption and extra authentication always reduce server workload.", "C": "The system becomes less usable for the end-user.", "D": "The system becomes cheaper to build."}, "answer": "C", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "What is the most common trade-off when breaking a large system into many small, independent services to improve maintainability?", "q_vi": "Sự đánh đổi phổ biến nhất khi chia một hệ thống lớn thành nhiều dịch vụ nhỏ, độc lập để cải thiện khả năng bảo trì là gì?", "options": {"A": "The system's overall performance may decrease.", "B": "The system becomes less secure.", "C": "The system becomes harder to scale because smaller independent services cannot be deployed separately.", "D": "The system's user interface becomes more complex."}, "answer": "A", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "Which of the following is an organizational (human) factor that influences architectural decisions?", "q_vi": "Yếu tố nào sau đây là yếu tố tổ chức (con người) ảnh hưởng đến các quyết định kiến ​​trúc?", "options": {"A": "The type of database selected after considering storage, query, and operational constraints", "B": "The speed of the server's CPU when measured without considering team communication or ownership", "C": "The skill level and experience of the development team", "D": "The network protocol being used by clients and servers during normal runtime communication"}, "answer": "C", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q10", "multi": false}, {"num": 11, "q_en": "Which quality attribute refers to a system's ability to continue operating even if some of its components have failed?", "q_vi": "Thuộc tính chất lượng nào đề cập đến khả năng tiếp tục hoạt động của hệ thống ngay cả khi một số thành phần của nó bị lỗi?", "options": {"A": "Resilience (or Fault Tolerance)", "B": "Performance under normal load when every component remains healthy", "C": "Usability", "D": "Security against unauthorized access and data breaches"}, "answer": "A", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q11", "multi": false}, {"num": 12, "q_en": "A design with a single, central, highly-protected \"vault\" for all its data is:", "q_vi": "Một thiết kế có một \"kho\" duy nhất, trung tâm, được bảo vệ cao cho tất cả dữ liệu của nó là:", "options": {"A": "Highly resilient but complex to manage because all failures can be isolated without affecting the central store.", "B": "Simple to protect, but has a single point of failure.", "C": "The best design for all high-security systems.", "D": "Very fast but not secure."}, "answer": "B", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q12", "multi": false}, {"num": 13, "q_en": "How is high availability (like \"99.999% uptime\") typically achieved in a system's architecture?", "q_vi": "Làm thế nào để đạt được tính sẵn sàng cao (như \"99,999% thời gian hoạt động\") trong kiến ​​trúc của hệ thống?", "options": {"A": "By using a faster programming language so every request completes before any server can fail", "B": "By implementing redundancy for critical components", "C": "By making the user interface simpler", "D": "By hiring more developers to manually restart failed services whenever outages happen"}, "answer": "B", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q13", "multi": false}, {"num": 14, "q_en": "What is the main disadvantage of building a system with high redundancy?", "q_vi": "Nhược điểm chính của việc xây dựng một hệ thống có độ dự phòng cao là gì?", "options": {"A": "It makes the system less secure because adding backup components always removes authentication and authorization.", "B": "It makes the system slower for users.", "C": "It significantly increases the system's cost and complexity.", "D": "It makes the system impossible to maintain."}, "answer": "C", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q14", "multi": false}, {"num": 15, "q_en": "What is the primary goal of creating architectural diagrams and documents?", "q_vi": "Mục tiêu chính của việc tạo sơ đồ và tài liệu kiến ​​trúc là gì?", "options": {"A": "To create a legal contract for the client that replaces discussion between engineers and stakeholders", "B": "To build a shared understanding among the development team", "C": "To prove the system will have no bugs before any testing, implementation, or review is performed", "D": "To automatically generate all the code without developers needing to make design decisions"}, "answer": "B", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q15", "multi": false}, {"num": 16, "q_en": "Which of the following is NOT a non-functional quality attribute?", "q_vi": "Điều nào sau đây KHÔNG phải là thuộc tính chất lượng phi chức năng?", "options": {"A": "A user must be able to reset their password.", "B": "The system must be secure from common attacks during normal public internet use.", "C": "The system must respond to user queries in under 2 seconds even during regular peak usage.", "D": "The system must be online 24/7."}, "answer": "A", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q16", "multi": false}, {"num": 17, "q_en": "Which of the following is a key influence on architectural design?", "q_vi": "Điều nào sau đây có ảnh hưởng chính đến thiết kế kiến ​​trúc?", "options": {"A": "The expected lifetime of the product", "B": "The brand and logo of the product as chosen by the marketing team before implementation", "C": "The marketing campaign for the product", "D": "The individual names of the developers"}, "answer": "A", "week": "Week04", "quiz": "Quiz01", "id": "Week04_Quiz01_Q17", "multi": false}, {"num": 1, "q_en": "Which architectural pattern separates an application into three interconnected components: data, user interface, and business logic?", "q_vi": "Mẫu kiến ​​trúc nào tách ứng dụng thành ba thành phần được kết nối với nhau: dữ liệu, giao diện người dùng và logic nghiệp vụ?", "options": {"A": "Model-View-Controller (MVC)", "B": "Client-Server with request/response communication roles between clients and centralized servers", "C": "Layered Architecture with presentation, business, and data access tiers arranged vertically", "D": "Microservices"}, "answer": "A", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q1", "multi": false}, {"num": 2, "q_en": "In a Layered Architecture, what is the ‘golden rule’ of communication between layers?", "q_vi": "Trong Kiến trúc lớp, 'quy tắc vàng' giao tiếp giữa các lớp là gì?", "options": {"A": "Any layer can call any other layer whenever it needs data or functionality", "B": "A layer can freely skip intermediate layers when direct access seems more convenient", "C": "A layer can only call the layer immediately adjacent to it (above or below).", "D": "A layer can only call services in the layer immediately below it."}, "answer": "D", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q2", "multi": false}, {"num": 3, "q_en": "What is a primary disadvantage of a monolithic architecture compared to a microservices architecture?", "q_vi": "Nhược điểm chính của kiến ​​trúc nguyên khối so với kiến trúc microservices là gì?", "options": {"A": "They are simpler to deploy and test in the beginning because all modules are packaged together", "B": "The entire application must be redeployed even for a small change.", "C": "They are generally more secure by default without needing additional design decisions", "D": "They have lower network latency for internal communication because calls stay inside one process"}, "answer": "B", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q3", "multi": false}, {"num": 4, "q_en": "Which is a cross-cutting concern?", "q_vi": "Đâu là mối quan tâm xuyên suốt?", "options": {"A": "Coupon calculation for one specific checkout promotion rule", "B": "Search ranking inside a particular product catalog feature", "C": "Security (e.g., auth, protection)", "D": "Image thumbnail size used only on a single gallery screen"}, "answer": "C", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q4", "multi": false}, {"num": 5, "q_en": "In MVC for web UIs, which statement is accurate?", "q_vi": "Trong MVC dành cho giao diện người dùng web, câu nào đúng?", "options": {"A": "Model lives only on clients and stores temporary screen state for a single page", "B": "Views register for model changes and refresh when the model updates", "C": "Controllers only render static HTML pages without processing user actions or input events", "D": "Servers never update models"}, "answer": "B", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q5", "multi": false}, {"num": 6, "q_en": "Which statement about HTTP in client–server apps is correct?", "q_vi": "Câu nào về HTTP trong ứng dụng máy khách-máy chủ là đúng?", "options": {"A": "Servers initiate requests to clients by default before any browser action occurs", "B": "Clients send requests; servers respond", "C": "HTTP is binary only and cannot carry readable request or response headers", "D": "HTTP requires XML payloads for every request and every response message"}, "answer": "B", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q6", "multi": false}, {"num": 7, "q_en": "Why is JSON commonly preferred over XML here?", "q_vi": "Tại sao JSON thường được ưa chuộng hơn XML ở đây?", "options": {"A": "Browsers can’t parse XML documents correctly in modern web applications because only JSON is supported by JavaScript", "B": "JSON is usually more compact and faster to parse, and maps to objects easily", "C": "JSON guarantees ACID transaction behavior for database operations across distributed microservice databases", "D": "XML can’t encode numbers or structured text values in a reliable way for browser-to-server communication"}, "answer": "B", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q7", "multi": false}, {"num": 8, "q_en": "In a multi-tier web architecture, which pairing is correct?", "q_vi": "Trong kiến ​​trúc web nhiều tầng, việc ghép nối nào là đúng?", "options": {"A": "Web server - user authentication and authorization logic only", "B": "Application server - application-specific operations", "C": "Database server - HTML page generation for browser rendering", "D": "Web server - ACID transaction processing for persistent data updates"}, "answer": "B", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q8", "multi": false}, {"num": 9, "q_en": "What’s the main role of a load balancer in client–server systems?", "q_vi": "Vai trò chính của bộ cân bằng tải trong hệ thống máy khách-máy chủ là gì?", "options": {"A": "Encrypt database tables before storing sensitive information permanently for every application server request", "B": "Distribute requests across servers to share load and improve availability", "C": "Replace authentication and authorization services for logged-in users across all backend applications", "D": "Eliminate all network latency between clients, application servers, and databases in every network path"}, "answer": "B", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q9", "multi": false}, {"num": 10, "q_en": "In the “multiple database per component” design, what extra piece keeps shared data correct?", "q_vi": "Trong thiết kế “nhiều cơ sở dữ liệu cho mỗi thành phần”, phần bổ sung nào giữ cho dữ liệu được chia sẻ chính xác?", "options": {"A": "A CDN that caches static images, scripts, and stylesheets near users", "B": "A reconciliation component/process", "C": "A sticky-session cookie that keeps one user connected to the same server", "D": "A single global mutex that locks every distributed database during updates"}, "answer": "B", "week": "Week04", "quiz": "Quiz02", "id": "Week04_Quiz02_Q10", "multi": false}, {"num": 1, "q_en": "Why is it beneficial for services in a cloud-based system to be stateless?", "q_vi": "Tại sao việc các dịch vụ trong hệ thống dựa trên đám mây không có trạng thái lại có lợi?", "options": {"A": "Stateless services are easier to program and require less code.", "B": "They can be easily replicated, run in parallel, and moved between virtual servers to handle scaling.", "C": "They are the only type of service that can communicate using XML-based protocols.", "D": "They maintain a persistent, in-memory copy of the user's session, which improves performance."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "What was a significant problem with the \"Web Services\" standards (e.g., SOAP, WSDL) from the early 2000s?", "q_vi": "Vấn đề nghiêm trọng với các tiêu chuẩn \"Dịch vụ Web\" (ví dụ: SOAP, WSDL) từ đầu những năm 2000 là gì?", "options": {"A": "They were too simple and did not support complex business logic.", "B": "They could only be written in one programming language.", "C": "They involved large, complex XML messages that were slow to analyze and had high overhead.", "D": "They did not have a standard for interface description."}, "answer": "C", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "What key insight, pioneered by companies like Amazon, helped define the modern microservice?", "q_vi": "Cái nhìn sâu sắc quan trọng nào, được tiên phong bởi các công ty như Amazon, đã giúp định hình nên vi dịch vụ hiện đại?", "options": {"A": "Services should be completely independent, with their own database and their own user interface.", "B": "All services in a system should share a single, highly optimized database to reduce complexity.", "C": "Services should focus only on technical tasks, while a central monolith handles all business logic.", "D": "A service should be related to multiple business functions to be efficient."}, "answer": "A", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "Which of the following describes the ideal design goal for microservices?", "q_vi": "Điều nào sau đây mô tả mục tiêu thiết kế lý tưởng cho microservice?", "options": {"A": "High coupling and high cohesion", "B": "Low coupling and low cohesion", "C": "High coupling and low cohesion", "D": "Low coupling and high cohesion"}, "answer": "D", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "Why is low coupling an important characteristic for microservices?", "q_vi": "Tại sao khả năng ghép nối thấp lại là đặc điểm quan trọng của vi dịch vụ?", "options": {"A": "It ensures that all services can be written in the same programming language.", "B": "It allows you to update a service (while maintaining its interface) without having to change other services in the system.", "C": "It minimizes the number of functions inside a single service, making the code simpler.", "D": "It forces all services to share a single, common database, which simplifies data management."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "When determining the appropriate \"size\" for a microservice, what guideline does the author suggest?", "q_vi": "Khi xác định “quy mô” phù hợp cho một microservice, tác giả đưa ra hướng dẫn nào?", "options": {"A": "The service's code should not exceed a strict limit, such as 500 lines of code.", "B": "The service should be small enough to be developed, tested, and deployed by a team in two weeks or less.", "C": "The service must encapsulate at least five related business functions to be considered a \"microservice.\"", "D": "The service should be large enough to handle a complete, end-to-end business workflow (e.g., user registration)."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "What is the \"common closure principle\" guideline for decomposing a system?", "q_vi": "Nguyên tắc \"nguyên tắc đóng chung\" để phân rã một hệ thống là gì?", "options": {"A": "All services that are part of the same business capability should be grouped together.", "B": "Elements of a system that are likely to be changed at the same time should be located within the same service.", "C": "All services should be \"closed\" for modification but \"open\" for extension.", "D": "Services should be decomposed based on the data they manage, not their function."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "What is the \"orchestration\" approach to service coordination?", "q_vi": "Cách tiếp cận \"điều phối\" để điều phối dịch vụ là gì?", "options": {"A": "Services communicate by publishing events that other services subscribe to, with no central controller.", "B": "A separate controller service (the \"conductor\") executes the workflow by calling component services in a specific order.", "C": "All services share a central database, which orchestrates the workflow using ACID transactions.", "D": "Services directly call each other in a peer-to-peer mesh, negotiating the workflow steps as they go."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "What is a \"compensating transaction\"?", "q_vi": "“Giao dịch đền bù” là gì?", "options": {"A": "A transaction that bundles all data updates into a single unit to guarantee consistency.", "B": "A transaction that reverses a previous operation when a failure is detected in a dependent service.", "C": "A log of all pending updates used to ensure \"eventual consistency\" between service replicas.", "D": "A special transaction used by a circuit breaker to test if a failed service has recovered."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "How does the \"choreography\" approach to service coordination work?", "q_vi": "Cách tiếp cận “vũ đạo” trong việc điều phối dịch vụ hoạt động như thế nào?", "options": {"A": "A central controller dictates the exact order of operations for all services.", "B": "Each service emits an event to indicate it has completed processing, and other services react to those events.", "C": "The API gateway is responsible for coordinating all service workflows.", "D": "Services use synchronous, direct calls to coordinate their actions in real-time."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q10", "multi": false}, {"num": 11, "q_en": "Why is the \"circuit breaker\" pattern often preferred over simple timeouts for managing external service failures?", "q_vi": "Tại sao mẫu \"ngắt mạch\" thường được ưa thích hơn thời gian chờ đơn giản để quản lý lỗi dịch vụ bên ngoài?", "options": {"A": "A circuit breaker encrypts the service request, making it more secure.", "B": "A circuit breaker immediately denies access to a failed service without waiting for the timeout, preventing system slowdown.", "C": "A circuit breaker automatically retries the request dozens of times until the service responds.", "D": "A circuit breaker automatically scales up a new instance of the failed service."}, "answer": "B", "week": "Week05", "quiz": "Quiz01", "id": "Week05_Quiz01_Q11", "multi": false}, {"num": 1, "q_en": "What does the acronym REST stand for?", "q_vi": "Từ viết tắt REST có nghĩa là gì?", "options": {"A": "Remote Execution Strategy for calling server-side procedures across a network", "B": "REpresentational State Transfer", "C": "Resource Entity Service Transfer for moving object records between distributed services", "D": "Reliable Enterprise Service Transport"}, "answer": "B", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q1", "multi": false}, {"num": 2, "q_en": "What is the fundamental concept of a \"resource\" in the REST architectural style?", "q_vi": "Khái niệm cơ bản về \"tài nguyên\" trong kiểu kiến ​​trúc REST là gì?", "options": {"A": "A function or method call that can be executed remotely through an endpoint, where the URL names an action rather than an addressable domain object.", "B": "Any chunk of data (e.g., a database record, document, or catalog item) that is identified by a unique URI.", "C": "A standardized message protocol, like SOAP or AMQP.", "D": "A long-lived stateful connection that is maintained between the client and server so each later request depends on previous session context."}, "answer": "B", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q2", "multi": false}, {"num": 3, "q_en": "In the RESTful architectural style, which HTTP verb is correctly mapped to its intended operation for managing a resource?", "q_vi": "Trong kiểu kiến ​​trúc RESTful, động từ HTTP nào được ánh xạ chính xác tới hoạt động dự định của nó để quản lý tài nguyên?", "options": {"A": "GET is used to create a new resource when the client sends parameters in the query string.", "B": "POST is used to modify an existing resource's data.", "C": "PUT is used to update or modify an existing resource.", "D": "DELETE is used to retrieve a read-only representation of a resource."}, "answer": "C", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q3", "multi": false}, {"num": 4, "q_en": "How should the GET verb be used in a RESTful service?", "q_vi": "Động từ GET nên được sử dụng như thế nào trong dịch vụ RESTful?", "options": {"A": "To create a new resource with a server-defined URI while also changing collection state each time the same request is sent.", "B": "To read a resource, and it should never update or change the resource's value.", "C": "To update an existing resource at a specific URI.", "D": "To delete all sub-resources under a specific URI."}, "answer": "B", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q4", "multi": false}, {"num": 5, "q_en": "Which HTTP verb is used to create a new resource, with the server typically assigning the new resource's URI?", "q_vi": "Động từ HTTP nào được sử dụng để tạo tài nguyên mới và máy chủ thường gán URI của tài nguyên mới?", "options": {"A": "GET, because retrieving the collection endpoint can also create a new item automatically.", "B": "PUT, because the client asks the server to choose a fresh URI for the new item.", "C": "POST", "D": "CREATE"}, "answer": "C", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q5", "multi": false}, {"num": 6, "q_en": "According to the text, what is the most commonly used representation for digital resources in modern RESTful microservices?", "q_vi": "Theo văn bản, cách thể hiện nào được sử dụng phổ biến nhất cho tài nguyên kỹ thuật số trong các dịch vụ vi mô RESTful hiện đại?", "options": {"A": "XML, especially because modern microservices usually require verbose schema-first payloads.", "B": "HTML, because browser-oriented page markup is normally used as the API payload format.", "C": "Plain Text, since REST APIs generally avoid structured key-value representations.", "D": "JSON"}, "answer": "D", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q6", "multi": false}, {"num": 7, "q_en": "In an HTTP request for a RESTful service, what is the purpose of the Content-Type header?", "q_vi": "Trong yêu cầu HTTP cho dịch vụ RESTful, mục đích của tiêu đề Kiểu nội dung là gì?", "options": {"A": "It specifies the data format (e.g., application/json) that the client is sending in the request body.", "B": "It specifies the content-types (e.g., application/json) that the client can process and finds acceptable in the service response.", "C": "It specifies the exact length and encoding of the response body so the client can decide which parser should be used.", "D": "It provides the authentication token to prove the client is allowed to access the resource."}, "answer": "A", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q7", "multi": false}, {"num": 8, "q_en": "In an HTTP response, what does the status code 200 indicate?", "q_vi": "Trong phản hồi HTTP, mã trạng thái 200 biểu thị điều gì?", "options": {"A": "The request has failed because the requested resource was not found, and the response body normally contains the missing resource representation.", "B": "The request has been successfully processed, but there is no associated content to return.", "C": "The request has been successfully processed, and the response body typically contains the requested data.", "D": "The request has failed because the input data was malformed (e.g., \"Unprocessable entity\")."}, "answer": "C", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q8", "multi": false}, {"num": 9, "q_en": "What does the HTTP status code 204 signify?", "q_vi": "Mã trạng thái HTTP 204 có ý nghĩa gì?", "options": {"A": "The resource was not found, but the operation is still considered partially successful because the server accepted the request.", "B": "The request was successful, but there is no content to return.", "C": "The service has encountered an internal failure, but it is still returning an empty success response to avoid exposing server details.", "D": "The request is malformed, and the server successfully applied the invalid changes without returning any representation."}, "answer": "B", "week": "Week05", "quiz": "Quiz02", "id": "Week05_Quiz02_Q9", "multi": false}, {"num": 1, "q_en": "What is the \"DevOps\" approach to service management?", "q_vi": "Phương pháp quản lý dịch vụ \"DevOps\" là gì?", "options": {"A": "A separate \"operations\" team is responsible for deploying and managing all services created by the \"development\" team.", "B": "The development team is responsible for deployment and service management as well as software development.", "C": "It is an approach where all development and operations are outsourced to a third-party vendor.", "D": "It is a set of tools used to automate only the testing, but not the deployment, of services."}, "answer": "B", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q1", "multi": false}, {"num": 2, "q_en": "What is the core principle of \"continuous deployment\"?", "q_vi": "Nguyên tắc cốt lõi của \"triển khai liên tục\" là gì?", "options": {"A": "New versions of the software are bundled and released periodically, typically three or four times per year.", "B": "As soon as a change to a service has been made and validated, the modified service is automatically re-deployed into production.", "C": "Developers are responsible for manually deploying their own services after getting approval from the operations team.", "D": "All microservices in the system must be deployed at the same time to ensure compatibility."}, "answer": "B", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q2", "multi": false}, {"num": 3, "q_en": "According to the continuous deployment pipeline diagram, what event triggers the start of the automated process?", "q_vi": "Theo sơ đồ quy trình triển khai liên tục, sự kiện nào kích hoạt quá trình tự động bắt đầu?", "options": {"A": "A service monitoring system detects a performance failure.", "B": "A user submits a new feature request to the development team.", "C": "A programmer commits a code change to the version management system (e.g., Git).", "D": "The team manager approves the deployment in a weekly planning meeting."}, "answer": "C", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q3", "multi": false}, {"num": 4, "q_en": "In the continuous deployment pipeline, what is the primary purpose of a \"container\" (e.g., Docker)?", "q_vi": "Trong quy trình triển khai liên tục, mục đích chính của \"vùng chứa\" (ví dụ: Docker) là gì?", "options": {"A": "To act as a virtual server that includes a full operating system.", "B": "To be a virtualized environment (deployment unit) that includes all the software and dependencies that a service needs to run.", "C": "To run the automated unit tests before building the system.", "D": "To monitor the service for failures after it has been deployed."}, "answer": "B", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q4", "multi": false}, {"num": 5, "q_en": "What is the role of a container management system like Kubernetes?", "q_vi": "Vai trò của hệ thống quản lý container như Kubernetes là gì?", "options": {"A": "It is a version control system used to store the source code for a service.", "B": "It is a tool for writing and running automated unit tests.", "C": "It automates container deployment and management, handling scheduling, load balancing, and service discovery.", "D": "It is a type of API gateway used to route traffic to different service versions."}, "answer": "C", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q5", "multi": false}, {"num": 6, "q_en": "In the continuous deployment pipeline, which automated tests are run after the service is containerized and deployed?", "q_vi": "Trong quy trình triển khai liên tục, những thử nghiệm tự động nào sẽ được chạy sau khi dịch vụ được đưa vào bộ chứa và triển khai?", "options": {"A": "Unit tests", "B": "Integration tests", "C": "Acceptance tests", "D": "All of the above"}, "answer": "D", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q6", "multi": false}, {"num": 7, "q_en": "How can a system using an API gateway safely manage a \"rollback\" if a newly deployed service version fails?", "q_vi": "Làm cách nào một hệ thống sử dụng cổng API có thể quản lý việc \"khôi phục\" một cách an toàn nếu phiên bản dịch vụ mới được triển khai không thành công?", "options": {"A": "The API gateway automatically deletes the failed service container and rebuilds the old one from source code.", "B": "The system maintains the old version, and if the monitor detects a problem, it simply switches the \"current version link\" back to the older service.", "C": "All client applications are forced to update their URIs to point to the older service version.", "D": "The system blocks all new requests, forcing them to time out until a developer manually fixes the bug in the new version."}, "answer": "B", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q7", "multi": false}, {"num": 8, "q_en": "When a service's API must change, how can the system support both old and new clients?", "q_vi": "Khi API của dịch vụ phải thay đổi, làm thế nào hệ thống có thể hỗ trợ cả client cũ và client mới?", "options": {"A": "By forcing all client services to update at the exact same time.", "B": "By including the version number as part of the resource's URI.", "C": "By deploying the new service on a completely different server domain.", "D": "By using a \"compensating transaction\" to automatically translate new API calls to the old format."}, "answer": "B", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q8", "multi": false}, {"num": 9, "q_en": "What is the purpose of a numbering convention like changing a service version from 001 to 101?", "q_vi": "Mục đích của quy ước đánh số như thay đổi phiên bản dịch vụ từ 001 thành 101 là gì?", "options": {"A": "To indicate a minor bug fix that does not change the API.", "B": "To signal to the API gateway that this service should be deployed in a container.", "C": "To identify whether a new version has introduced an API change.", "D": "To show that the service is now managed by a different development team."}, "answer": "C", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q9", "multi": false}, {"num": 10, "q_en": "According to the text, what is a primary risk of deploying new software services that testing can never completely eliminate?", "q_vi": "Theo văn bản, rủi ro chính khi triển khai các dịch vụ phần mềm mới mà việc kiểm tra không bao giờ có thể loại bỏ hoàn toàn là gì?", "options": {"A": "The cost of the cloud servers will increase.", "B": "Unanticipated problems will be caused by the interactions between the new version and existing services.", "C": "The service's source code will be stolen during deployment.", "D": "The service will be deployed using the wrong programming language."}, "answer": "B", "week": "Week05", "quiz": "Quiz03", "id": "Week05_Quiz03_Q10", "multi": false}, {"num": 1, "q_en": "What is the main idea of microservices architecture?", "q_vi": "Ý tưởng chính của kiến trúc microservices là gì?", "options": {"A": "Build one large application with all features inside", "B": "Split an application into small independent services", "C": "Store all data in one shared database", "D": "Deploy only frontend applications"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q1", "multi": false}, {"num": 2, "q_en": "Which is a common advantage of microservices?", "q_vi": "Ưu điểm chung của microservice là gì?", "options": {"A": "Easier distributed debugging", "B": "No need for deployment planning", "C": "Independent service deployment", "D": "One team must own all features, databases, and operational infrastructure for the entire company system"}, "answer": "C", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q2", "multi": false}, {"num": 3, "q_en": "A company has one large codebase where a small change requires redeploying the whole system. What architecture is this likely?", "q_vi": "Một công ty có một codebase lớn, trong đó một thay đổi nhỏ sẽ yêu cầu triển khai lại toàn bộ hệ thống. Kiến trúc này có khả năng là gì?", "options": {"A": "Microservices", "B": "Serverless", "C": "Monolithic", "D": "Event-driven"}, "answer": "C", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q3", "multi": false}, {"num": 4, "q_en": "What is a major disadvantage of microservices?", "q_vi": "Nhược điểm chính của microservice là gì?", "options": {"A": "Too simple to operate", "B": "Increased distributed system complexity", "C": "No need for monitoring", "D": "Cannot use databases"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q4", "multi": false}, {"num": 5, "q_en": "What does loose coupling mean in microservices?", "q_vi": "Khớp nối lỏng lẻo có ý nghĩa gì trong microservice?", "options": {"A": "Services depend heavily on each other's internal code", "B": "Services communicate through clear interfaces", "C": "Services share the same source files", "D": "Services must use the same programming language"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q5", "multi": false}, {"num": 6, "q_en": "Why might different teams own different microservices?", "q_vi": "Tại sao các nhóm khác nhau có thể sở hữu các vi dịch vụ khác nhau?", "options": {"A": "To reduce responsibility", "B": "To allow independent development and delivery", "C": "To force all teams to use one database", "D": "To avoid testing"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q6", "multi": false}, {"num": 7, "q_en": "Which protocol is commonly used for public HTTP APIs?", "q_vi": "Giao thức nào thường được sử dụng cho API HTTP công khai?", "options": {"A": "REST", "B": "BIOS", "C": "SMTP only", "D": "FTP only"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q7", "multi": false}, {"num": 8, "q_en": "Which communication style is usually better when services should not wait for each other immediately?", "q_vi": "Phong cách giao tiếp nào thường tốt hơn khi các dịch vụ không nên chờ đợi nhau ngay lập tức?", "options": {"A": "Synchronous REST call", "B": "Asynchronous messaging", "C": "Direct database sharing between multiple unrelated backend services", "D": "Manual file copy"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q8", "multi": false}, {"num": 9, "q_en": "What is the role of an API Gateway?", "q_vi": "Vai trò của Cổng API là gì?", "options": {"A": "Store all business data", "B": "Act as an entry point for client requests", "C": "Replace all backend services", "D": "Compile source code"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q9", "multi": false}, {"num": 10, "q_en": "A payment service calls an order service and waits for an immediate response. What type of communication is this?", "q_vi": "Dịch vụ thanh toán gọi dịch vụ đặt hàng và chờ phản hồi ngay lập tức. Đây là loại giao tiếp gì?", "options": {"A": "Asynchronous communication using event queues and delayed processing pipelines", "B": "Synchronous", "C": "Offline batch processing", "D": "Broadcast-only communication"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q10", "multi": false}, {"num": 11, "q_en": "Which technology is commonly used as a message broker?", "q_vi": "Công nghệ nào thường được sử dụng làm nhà môi giới tin nhắn?", "options": {"A": "RabbitMQ", "B": "Microsoft Word", "C": "Photoshop", "D": "GitHub README"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q11", "multi": false}, {"num": 12, "q_en": "Why should microservices avoid depending too much on synchronous calls?", "q_vi": "Tại sao microservice nên tránh phụ thuộc quá nhiều vào các lệnh gọi đồng bộ?", "options": {"A": "It makes frontend design impossible", "B": "It can create cascading failures", "C": "It removes all databases", "D": "It prevents using Docker"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q12", "multi": false}, {"num": 13, "q_en": "Why is Docker useful for microservices?", "q_vi": "Tại sao Docker hữu ích cho microservice?", "options": {"A": "It removes the need for testing", "B": "It packages an application with its dependencies", "C": "It replaces all databases automatically in cloud-native systems", "D": "It only works for frontend apps"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q13", "multi": false}, {"num": 14, "q_en": "What is Kubernetes mainly used for?", "q_vi": "Kubernetes chủ yếu được sử dụng để làm gì?", "options": {"A": "Writing Java code", "B": "Managing and orchestrating containers", "C": "Designing UI icons", "D": "Creating exam questions"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q14", "multi": false}, {"num": 15, "q_en": "What does horizontal scaling mean?", "q_vi": "Tỷ lệ ngang có nghĩa là gì?", "options": {"A": "Increasing CPU and memory of a single server continuously over time", "B": "Adding more service instances", "C": "Deleting old logs", "D": "Moving code into one file"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q15", "multi": false}, {"num": 16, "q_en": "What is a rolling update?", "q_vi": "Cập nhật liên tục là gì?", "options": {"A": "Updating all services manually once per year", "B": "Gradually replacing old instances with new ones", "C": "Deleting production before deployment", "D": "Deploying without testing"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q16", "multi": false}, {"num": 17, "q_en": "What is CI/CD?", "q_vi": "CI/CD là gì?", "options": {"A": "A database model", "B": "Continuous Integration and Continuous Delivery or Deployment", "C": "A network cable type", "D": "A testing-only tool"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q17", "multi": false}, {"num": 18, "q_en": "A service has high traffic during registration week. What should the operation team likely do?", "q_vi": "Một dịch vụ có lưu lượng truy cập cao trong tuần đăng ký. Đội ngũ vận hành có thể nên làm gì?", "options": {"A": "Shut down the service", "B": "Scale the service horizontally", "C": "Merge all services into a larger monolithic application before peak registration traffic", "D": "Disable monitoring"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q18", "multi": false}, {"num": 19, "q_en": "What is the database-per-service pattern?", "q_vi": "Mẫu cơ sở dữ liệu trên mỗi dịch vụ là gì?", "options": {"A": "Every service owns its own database", "B": "All services must share one database", "C": "Only frontend services use databases", "D": "Databases are not allowed"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q19", "multi": false}, {"num": 20, "q_en": "Why is a shared database risky in microservices?", "q_vi": "Tại sao cơ sở dữ liệu dùng chung lại có rủi ro trong microservice?", "options": {"A": "It makes services too independent", "B": "It creates tight coupling between services", "C": "It prevents SQL queries", "D": "It improves all security automatically"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q20", "multi": false}, {"num": 21, "q_en": "What does eventual consistency mean?", "q_vi": "Tính nhất quán cuối cùng có nghĩa là gì?", "options": {"A": "Data synchronization permanently fails between services", "B": "Data may become consistent after some delay", "C": "Data is always instantly synchronized across every service and database", "D": "Data cannot be updated"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q21", "multi": false}, {"num": 22, "q_en": "Which pattern helps manage transactions across multiple services?", "q_vi": "Mẫu nào giúp quản lý giao dịch trên nhiều dịch vụ?", "options": {"A": "Singleton", "B": "Saga", "C": "Factory Method", "D": "MVC"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q22", "multi": false}, {"num": 23, "q_en": "What is a circuit breaker used for?", "q_vi": "Cầu dao dùng để làm gì?", "options": {"A": "Stop repeated calls to a failing service", "B": "Encrypt database passwords", "C": "Build container images", "D": "Design user interfaces"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q23", "multi": false}, {"num": 24, "q_en": "Why are timeouts important in microservices?", "q_vi": "Tại sao thời gian chờ lại quan trọng trong microservice?", "options": {"A": "They make services wait forever", "B": "They prevent a service from waiting too long", "C": "They remove the need for APIs, monitoring systems, and distributed tracing tools", "D": "They replace monitoring"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q24", "multi": false}, {"num": 25, "q_en": "What problem can retries cause if used carelessly?", "q_vi": "Việc thử lại có thể gây ra vấn đề gì nếu sử dụng không cẩn thận?", "options": {"A": "Reduced network traffic", "B": "Increased load on a failing service", "C": "Better UI design", "D": "Automatic database migration"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q25", "multi": false}, {"num": 26, "q_en": "What is fault isolation?", "q_vi": "Cách ly lỗi là gì?", "options": {"A": "Allowing one failed service to crash the whole system", "B": "Preventing one service failure from spreading", "C": "Removing all error handling", "D": "Keeping all code in one service"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q26", "multi": false}, {"num": 27, "q_en": "A recommendation service fails, but users can still place orders. What principle is shown?", "q_vi": "Dịch vụ giới thiệu không thành công nhưng người dùng vẫn có thể đặt hàng. Nguyên tắc nào được thể hiện?", "options": {"A": "Total system failure caused by tightly coupled service dependencies", "B": "Graceful degradation", "C": "Manual deployment coordination", "D": "Database sharing"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q27", "multi": false}, {"num": 28, "q_en": "What is load balancing?", "q_vi": "Cân bằng tải là gì?", "options": {"A": "Sending all requests to one instance", "B": "Distributing requests across multiple instances", "C": "Deleting unused services", "D": "Combining all APIs into one database"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q28", "multi": false}, {"num": 29, "q_en": "Why is centralized logging useful?", "q_vi": "Tại sao việc ghi log tập trung lại hữu ích?", "options": {"A": "It hides errors", "B": "It collects logs from many services in one place", "C": "It removes the need for testing", "D": "It prevents deployment"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q29", "multi": false}, {"num": 30, "q_en": "What does distributed tracing help developers understand?", "q_vi": "Theo dõi phân tán giúp các nhà phát triển hiểu được điều gì?", "options": {"A": "How a request travels across services", "B": "How to write HTML only", "C": "How to remove APIs", "D": "How to design database tables only"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q30", "multi": false}, {"num": 31, "q_en": "Which tool is commonly used for metrics monitoring?", "q_vi": "Công cụ nào thường được sử dụng để theo dõi số liệu?", "options": {"A": "Prometheus", "B": "PowerPoint presentation software used for creating engineering management reports", "C": "Notepad", "D": "Excel only"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q31", "multi": false}, {"num": 32, "q_en": "A user request is slow, but no single service clearly fails. What observability method is most helpful?", "q_vi": "Yêu cầu của người dùng chậm, nhưng không có dịch vụ nào bị lỗi rõ ràng. Phương pháp quan sát nào hữu ích nhất?", "options": {"A": "Distributed tracing", "B": "Ignoring the issue", "C": "Manual screenshot", "D": "Reinstalling the frontend"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q32", "multi": false}, {"num": 33, "q_en": "What is JWT commonly used for?", "q_vi": "JWT thường được sử dụng để làm gì?", "options": {"A": "User authentication and authorization tokens", "B": "Container orchestration across distributed Kubernetes environments", "C": "Database indexing", "D": "UI animation"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q33", "multi": false}, {"num": 34, "q_en": "Why should services use HTTPS/TLS?", "q_vi": "Tại sao các dịch vụ nên sử dụng HTTPS/TLS?", "options": {"A": "To make requests slower", "B": "To encrypt communication", "C": "To remove authentication", "D": "To replace logs"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q34", "multi": false}, {"num": 35, "q_en": "Where is authentication often handled in a microservices system?", "q_vi": "Xác thực thường được xử lý ở đâu trong hệ thống microservice?", "options": {"A": "API Gateway or identity service", "B": "CSS file", "C": "Local text document", "D": "User browser only"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q35", "multi": false}, {"num": 36, "q_en": "Why is service-to-service authentication important?", "q_vi": "Tại sao xác thực giữa các dịch vụ lại quan trọng?", "options": {"A": "Internal services should blindly trust all requests", "B": "Services need to verify other services", "C": "It removes all network traffic", "D": "It replaces deployment pipelines"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q36", "multi": false}, {"num": 37, "q_en": "Why is API versioning important?", "q_vi": "Tại sao việc lập phiên bản API lại quan trọng?", "options": {"A": "To allow changes without breaking existing clients", "B": "To delete old services immediately after every deployment cycle", "C": "To avoid documentation", "D": "To prevent testing"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q37", "multi": false}, {"num": 38, "q_en": "A team changes an API response format and another team's service fails. What was likely missing?", "q_vi": "Một nhóm thay đổi định dạng phản hồi API và dịch vụ của nhóm khác không thành công. Điều gì có thể đã bị thiếu?", "options": {"A": "UI animation", "B": "Backward compatibility or contract testing", "C": "More comments in CSS", "D": "A shared password"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q38", "multi": false}, {"num": 39, "q_en": "In professional microservices development, who should usually own a service?", "q_vi": "Trong quá trình phát triển microservice chuyên nghiệp, ai thường nên sở hữu một dịch vụ?", "options": {"A": "A clear responsible team", "B": "No one", "C": "Only the database administrator", "D": "Only the customer"}, "answer": "A", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q39", "multi": false}, {"num": 40, "q_en": "What does DevOps culture encourage?", "q_vi": "Văn hóa DevOps khuyến khích điều gì?", "options": {"A": "Separation between developers and operations with no communication", "B": "Collaboration between development and operations", "C": "Manual deployment only", "D": "Avoiding monitoring"}, "answer": "B", "week": "Week05", "quiz": "Quiz04", "id": "Week05_Quiz04_Q40", "multi": false}, {"num": 1, "q_en": "What is the main goal of Requirement Engineering (RE)?", "q_vi": "Mục tiêu chính của Kỹ thuật yêu cầu (RE) là gì?", "options": {"A": "To design the software architecture", "B": "To identify, analyze, and document what the system should do", "C": "To write and test program code", "D": "To deploy the final software"}, "answer": "B", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "Which of the following best describes a “requirement”?", "q_vi": "Điều nào sau đây mô tả đúng nhất một “yêu cầu”?", "options": {"A": "A wish list from users", "B": "A measurable statement of what the system must do or a constraint it must satisfy", "C": "A design diagram of the system", "D": "A testing plan for the final product"}, "answer": "B", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "What is the biggest risk of skipping the RE phase?", "q_vi": "Rủi ro lớn nhất khi bỏ qua giai đoạn RE là gì?", "options": {"A": "Increased speed of development", "B": "Misunderstanding stakeholder needs leading to project failure", "C": "Lack of programming resources", "D": "Poor user interface design only"}, "answer": "B", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "Which activity does NOT belong to Requirement Engineering?", "q_vi": "Hoạt động nào KHÔNG thuộc về Kỹ thuật Yêu cầu?", "options": {"A": "Eliciting stakeholder needs", "B": "Defining software requirements", "C": "Writing code in Python", "D": "Validating requirements with users"}, "answer": "C", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "Most software project failures are primarily due to:", "q_vi": "Hầu hết các dự án phần mềm thất bại chủ yếu là do:", "options": {"A": "Lack of testing", "B": "Poor requirements and changing needs", "C": "Low coding standards", "D": "Poor hardware selection"}, "answer": "B", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "The phrase “System shall …” is typically used to express:", "q_vi": "Cụm từ “System will…” thường được dùng để diễn đạt:", "options": {"A": "Design choices", "B": "Implementation tasks", "C": "Requirements statements", "D": "Testing criteria"}, "answer": "C", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "The primary purpose of RE is to:", "q_vi": "Mục đích chính của Kỹ thuật yêu cầu (RE) là:", "options": {"A": "Gather user needs and define system behavior", "B": "Implement the software solution", "C": "Maintain servers", "D": "Write design patterns"}, "answer": "A", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "In the SDLC, RE is positioned:", "q_vi": "Trong SDLC, RE được định vị:", "options": {"A": "Before design and coding", "B": "After system deployment", "C": "Parallel to maintenance only", "D": "During debugging"}, "answer": "A", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "A “stakeholder” in RE is:", "q_vi": "“Các bên liên quan” trong RE là:", "options": {"A": "Only the end-user", "B": "Anyone affected by or interested in the system", "C": "The developer team only", "D": "Only project managers"}, "answer": "B", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "What is the main difference between a requirement and a design?", "q_vi": "Sự khác biệt chính giữa yêu cầu và thiết kế là gì?", "options": {"A": "Requirements define what; designs define how", "B": "Requirements define how; designs define what", "C": "They are identical in purpose", "D": "Designs are always written by clients"}, "answer": "A", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q10", "multi": false}, {"num": 11, "q_en": "In Requirement Engineering, “scope creep” happens when:", "q_vi": "Trong Kỹ thuật yêu cầu, “sự thay đổi phạm vi” xảy ra khi:", "options": {"A": "Requirements are reduced due to constraints", "B": "New requirements are added without control", "C": "Users are removed from the process", "D": "The project is completed early"}, "answer": "B", "week": "Week06", "quiz": "Quiz01", "id": "Week06_Quiz01_Q11", "multi": false}, {"num": 1, "q_en": "Functional requirements describe:", "q_vi": "Yêu cầu chức năng mô tả:", "options": {"A": "System constraints or performance expectations", "B": "What the system should do", "C": "The physical network structure", "D": "Organizational policies only"}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q1", "multi": false}, {"num": 2, "q_en": "Which of the following is an example of a functional requirement?", "q_vi": "Điều nào sau đây là ví dụ về yêu cầu chức năng?", "options": {"A": "System shall support 500 users simultaneously.", "B": "The interface must be intuitive.", "C": "System shall allow mentors to view student profiles.", "D": "Response time must be under 3 seconds."}, "answer": "C", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q2", "multi": false}, {"num": 3, "q_en": "Which statement represents a non-functional requirement?", "q_vi": "Câu lệnh nào thể hiện yêu cầu phi chức năng?", "options": {"A": "Allow mentors to upload a profile picture.", "B": "Encrypt all user data during transmission.", "C": "Allow students to log in via university ID.", "D": "Enable admins to reset passwords."}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q3", "multi": false}, {"num": 4, "q_en": "Non-functional requirements are also known as:", "q_vi": "Yêu cầu phi chức năng còn được gọi là:", "options": {"A": "System constraints", "B": "Quality attributes", "C": "Data models", "D": "Prototypes"}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q4", "multi": false}, {"num": 5, "q_en": "The “FURPS” model includes all except:", "q_vi": "Mô hình “FURPS” bao gồm tất cả ngoại trừ:", "options": {"A": "Functionality", "B": "Usability", "C": "Reliability", "D": "Productivity"}, "answer": "D", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q5", "multi": false}, {"num": 6, "q_en": "Which example is a domain requirement for a university system?", "q_vi": "Ví dụ nào là yêu cầu về miền đối với hệ thống đại học?", "options": {"A": "Must store mentor contact information.", "B": "Must integrate with university login system.", "C": "Should display mentor list within 3 seconds.", "D": "Must allow password reset feature."}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q6", "multi": false}, {"num": 7, "q_en": "Why are domain requirements important?", "q_vi": "Tại sao yêu cầu về tên miền lại quan trọng?", "options": {"A": "They define visual design rules.", "B": "They prevent violation of external constraints and regulations.", "C": "They help reduce code duplication.", "D": "They determine testing order."}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q7", "multi": false}, {"num": 8, "q_en": "Which requirement is poorly written?", "q_vi": "Yêu cầu nào được viết kém?", "options": {"A": "System shall display mentor list.", "B": "System shall be user-friendly.", "C": "System shall validate student ID.", "D": "System shall log mentor sessions."}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q8", "multi": false}, {"num": 9, "q_en": "Functional and non-functional requirements differ because:", "q_vi": "Yêu cầu chức năng và phi chức năng khác nhau vì:", "options": {"A": "Functional define features; non-functional define qualities.", "B": "Both describe coding logic.", "C": "Non-functional are optional.", "D": "Functional depend on the hardware."}, "answer": "A", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q9", "multi": false}, {"num": 10, "q_en": "In testing, non-functional requirements are verified by:", "q_vi": "Trong thử nghiệm, các yêu cầu phi chức năng được xác minh bằng cách:", "options": {"A": "Functional unit tests", "B": "Measurement and performance evaluation", "C": "System walkthroughs only", "D": "Code review"}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q10", "multi": false}, {"num": 11, "q_en": "Which type of requirement usually originates from laws or industry regulations?", "q_vi": "Loại yêu cầu nào thường bắt nguồn từ luật pháp hoặc quy định của ngành?", "options": {"A": "Functional", "B": "Domain", "C": "Non-functional", "D": "Performance"}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q11", "multi": false}, {"num": 12, "q_en": "Which of the following sets best represents the three types of requirements?", "q_vi": "Bộ nào sau đây thể hiện tốt nhất ba loại yêu cầu?", "options": {"A": "Behavioral, System, Logical", "B": "Functional, Non-functional, Domain", "C": "Physical, Logical, Conceptual", "D": "Performance, Usability, Design"}, "answer": "B", "week": "Week06", "quiz": "Quiz02", "id": "Week06_Quiz02_Q12", "multi": false}, {"num": 1, "q_en": "Which of the following lists the main phases of RE in order?", "q_vi": "Điều nào sau đây liệt kê các giai đoạn chính của Kỹ thuật yêu cầu (RE) theo thứ tự?", "options": {"A": "Specification → Validation → Elicitation → Management", "B": "Elicitation → Analysis → Specification → Validation → Management", "C": "Analysis → Elicitation → Validation → Specification", "D": "Planning → Implementation → Testing"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q1", "multi": false}, {"num": 2, "q_en": "The goal of the elicitation phase is to:", "q_vi": "Mục tiêu của giai đoạn thu thập yêu cầu (elicitation) là:", "options": {"A": "Code the software", "B": "Identify and gather stakeholder needs", "C": "Write test scripts", "D": "Produce user manuals"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q2", "multi": false}, {"num": 3, "q_en": "Which technique is commonly used during requirement elicitation?", "q_vi": "Kỹ thuật nào thường được sử dụng trong quá trình khơi gợi yêu cầu?", "options": {"A": "Unit testing", "B": "Interviews", "C": "System integration", "D": "Debugging"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q3", "multi": false}, {"num": 4, "q_en": "What is a common challenge in elicitation?", "q_vi": "Khó khăn thường gặp trong việc khơi gợi là gì?", "options": {"A": "Stakeholders rarely provide conflicting requirements.", "B": "Users easily express all their needs.", "C": "Hidden assumptions and vague goals", "D": "Developers don’t participate."}, "answer": "C", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q4", "multi": false}, {"num": 5, "q_en": "The analysis phase focuses on:", "q_vi": "Giai đoạn phân tích tập trung vào:", "options": {"A": "Writing final code", "B": "Resolving requirement conflicts and prioritizing needs", "C": "Conducting security audits", "D": "Defining test metrics"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q5", "multi": false}, {"num": 6, "q_en": "The MoSCoW method is used for:", "q_vi": "Phương pháp MoSCoW được sử dụng cho:", "options": {"A": "Designing the UI", "B": "Requirement prioritization", "C": "Project budgeting", "D": "Team scheduling"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q6", "multi": false}, {"num": 7, "q_en": "The output of the specification phase is typically a:", "q_vi": "Đầu ra của giai đoạn đặc tả thường là:", "options": {"A": "Source code file", "B": "Software Requirements Specification (SRS)", "C": "UML activity diagram", "D": "Test execution plan"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q7", "multi": false}, {"num": 8, "q_en": "Requirement validation ensures that requirements are:", "q_vi": "Xác nhận yêu cầu đảm bảo rằng các yêu cầu:", "options": {"A": "Implemented efficiently", "B": "Correct, complete, consistent, and feasible", "C": "Prioritized by management only", "D": "Frozen after documentation"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q8", "multi": false}, {"num": 9, "q_en": "Which method can be used to validate requirements?", "q_vi": "Phương pháp nào có thể được sử dụng để xác nhận các yêu cầu?", "options": {"A": "Unit tests", "B": "Walkthroughs and reviews", "C": "Deployment reports", "D": "Database normalization"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q9", "multi": false}, {"num": 10, "q_en": "Requirement management is necessary because:", "q_vi": "Quản lý yêu cầu là cần thiết vì:", "options": {"A": "Requirements never change", "B": "It handles updates, traceability, and version control", "C": "It only tracks test cases", "D": "It focuses on team structure"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q10", "multi": false}, {"num": 11, "q_en": "What tool could support requirement management?", "q_vi": "Công cụ nào có thể hỗ trợ quản lý yêu cầu?", "options": {"A": "Visual Studio Code", "B": "Jira or ReqView", "C": "MySQL", "D": "Git Bash"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q11", "multi": false}, {"num": 12, "q_en": "In Agile methods, Requirement Engineering is:", "q_vi": "Trong các phương pháp Agile, Kỹ thuật yêu cầu là:", "options": {"A": "Done once before coding", "B": "Continuous through backlog refinement and iteration", "C": "Skipped entirely", "D": "Done after deployment"}, "answer": "B", "week": "Week06", "quiz": "Quiz03", "id": "Week06_Quiz03_Q12", "multi": false}, {"num": 1, "q_en": "The primary purpose of a software process model is to:", "q_vi": "Mục đích chính của mô hình quy trình phần mềm là:", "options": {"A": "Force all developers to work the same way.", "B": "Provide structure and guidance to the software development lifecycle.", "C": "Remove the need for customer involvement.", "D": "Guarantee zero defects."}, "answer": "B", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q1", "multi": false}, {"num": 2, "q_en": "Which analogy BEST represents the importance of having a software process:", "q_vi": "Sự tương tự nào TỐT NHẤT thể hiện tầm quan trọng của việc có một quy trình phần mềm:", "options": {"A": "Taking an exam without studying.", "B": "Cooking a meal by following a recipe.", "C": "Listening to music while working.", "D": "Shopping without a budget."}, "answer": "B", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q2", "multi": false}, {"num": 3, "q_en": "Which of the following is the most important reason why software process models differ across projects:", "q_vi": "Điều nào sau đây là lý do quan trọng nhất khiến các mô hình quy trình phần mềm khác nhau giữa các dự án:", "options": {"A": "Developer personal preferences.", "B": "Differences in customer hobbies.", "C": "Variation in project uncertainty and requirements stability.", "D": "Availability of office equipment."}, "answer": "C", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q3", "multi": false}, {"num": 4, "q_en": "Early software processes were heavily influenced by:", "q_vi": "Các quy trình phần mềm ban đầu bị ảnh hưởng nặng nề bởi:", "options": {"A": "Social media platforms.", "B": "Manufacturing and engineering disciplines.", "C": "Modern agile startups.", "D": "Open-source community collaboration."}, "answer": "B", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q4", "multi": false}, {"num": 5, "q_en": "A software process helps improve product quality primarily by:", "q_vi": "Quy trình phần mềm giúp cải thiện chất lượng sản phẩm chủ yếu bằng cách:", "options": {"A": "Standardizing development activities.", "B": "Reducing team communication.", "C": "Preventing all requirement changes.", "D": "Eliminating the need for testing."}, "answer": "A", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q5", "multi": false}, {"num": 6, "q_en": "A process without defined stages or structure usually leads to:", "q_vi": "Một quy trình không có các giai đoạn hoặc cấu trúc xác định thường dẫn đến:", "options": {"A": "High predictability.", "B": "Consistent product quality.", "C": "Chaos and miscommunication.", "D": "Reduced development time."}, "answer": "C", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q6", "multi": false}, {"num": 7, "q_en": "Which of the following is considered a major category of software process models:", "q_vi": "Điều nào sau đây được coi là một loại chính của mô hình quy trình phần mềm:", "options": {"A": "Sequential vs Functional.", "B": "Predictive vs Adaptive.", "C": "Horizontal vs Vertical.", "D": "Internal vs External."}, "answer": "B", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q7", "multi": false}, {"num": 8, "q_en": "Which situation most strongly demands a structured software process:", "q_vi": "Tình huống nào đòi hỏi mạnh mẽ nhất một quy trình phần mềm có cấu trúc:", "options": {"A": "A small assignment done by one student.", "B": "A large project with multiple teams and responsibilities.", "C": "A fun side project made for entertainment.", "D": "A quick prototype for personal learning."}, "answer": "B", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q8", "multi": false}, {"num": 9, "q_en": "One of the central challenges that drove the evolution of software processes was:", "q_vi": "Một trong những thách thức trọng tâm thúc đẩy sự phát triển của quy trình phần mềm là:", "options": {"A": "Hardware prices decreasing.", "B": "Increasing complexity and changing requirements.", "C": "Fewer people wanting to be developers.", "D": "Overabundance of technical documentation."}, "answer": "B", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q9", "multi": false}, {"num": 10, "q_en": "Which statement best describes the role of a process model:", "q_vi": "Câu nào mô tả đúng nhất vai trò của một mô hình quy trình:", "options": {"A": "It guarantees the fastest possible development.", "B": "It ensures that all teams worldwide use identical workflows.", "C": "It provides a structured approach for producing software.", "D": "It eliminates the need for planning."}, "answer": "C", "week": "Week07", "quiz": "Quiz01", "id": "Week07_Quiz01_Q10", "multi": false}, {"num": 1, "q_en": "Predictive models rely heavily on:", "q_vi": "Các mô hình dự đoán phụ thuộc rất nhiều vào:", "options": {"A": "Early detailed planning.", "B": "Flexible iteration.", "C": "Minimal documentation.", "D": "Constant requirement changes."}, "answer": "A", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q1", "multi": false}, {"num": 2, "q_en": "A predictive model is MOST effective when:", "q_vi": "Mô hình dự đoán có hiệu quả NHẤT khi:", "options": {"A": "Requirements are stable and well understood.", "B": "Requirements change daily.", "C": "Customers are unsure of what they want.", "D": "The project requires rapid experimentation."}, "answer": "A", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q2", "multi": false}, {"num": 3, "q_en": "The Waterfall Model is BEST described as:", "q_vi": "Mô hình Thác nước được mô tả TỐT NHẤT là:", "options": {"A": "A highly flexible and cyclic approach.", "B": "A sequential process with fixed phases.", "C": "A feedback-driven iterative model.", "D": "A continuous flow system."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q3", "multi": false}, {"num": 4, "q_en": "A key weakness of the Waterfall Model is that:", "q_vi": "Điểm yếu chính của Mô hình Thác nước là:", "options": {"A": "It involves too much customer collaboration.", "B": "It delivers working software late in the process.", "C": "It prevents all requirement misunderstandings.", "D": "It eliminates the need for documentation."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q4", "multi": false}, {"num": 5, "q_en": "The V-Model primarily emphasizes:", "q_vi": "Mô hình chữ V chủ yếu nhấn mạnh:", "options": {"A": "Minimum planning.", "B": "Heavy prototyping.", "C": "Early and structured test planning.", "D": "No verification activities."}, "answer": "C", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q5", "multi": false}, {"num": 6, "q_en": "The \"V\" shape in the V-Model represents:", "q_vi": "Hình \"V\" trong V-Model thể hiện:", "options": {"A": "Cost on the left, value on the right.", "B": "Increasing complexity over time.", "C": "Corresponding verification and validation phases.", "D": "The velocity of development."}, "answer": "C", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q6", "multi": false}, {"num": 7, "q_en": "The Incremental Model differs from Waterfall because it:", "q_vi": "Mô hình tăng dần khác với Thác nước vì nó:", "options": {"A": "Eliminates documentation.", "B": "Allows partial delivery of working software.", "C": "Requires no upfront planning.", "D": "Does not use iterations."}, "answer": "B", "week": "Week07", "quiz": "Quiz02", "id": "Week07_Quiz02_Q7", "multi": false}, {"num": 8, "q_en": "Predictive models tend to struggle when:", "q_v
