<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ticket CSS</title>
        <link rel = "stylesheet" type ="text/css" href="style.css">
    </head>
    <body>
        <div class ="table">
             <p class="id">Ticket ID: 123456789</p>
            <table class>
                <tr>
                    <th class ="headtable">Name</th>
                    <td>
                        <span class="greendot"></span>
                        <a href="#" class ="name">Parker Tom</a>
                        <p class = "active">No Active Support</p>
                    </td>
                </tr>
                <tr>
                    <th  class = "headtable">Email</th>
                    <td>
                        <p class="email">tom@gmail.com</p>
                    </td>
                </tr>

                <tr>
                    <th  class = "headtable">Response time</th>
                    <td>
                        <p class="time">72 hours, 60 hours left</p>
                    </td>
                </tr>
                <tr>
                    <th  class = "headtable">Last action</th>
                    <td>
                        <p class="action">Never been locked</p>
                        <a class ="link" href ="#">Link to public post</a>
                    </td>
                </tr>
                <tr>
                    <th  class = "headtable">Status</th>
                    <td>
                        <p class="status">Not answered</p>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
