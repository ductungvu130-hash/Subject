<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Fruits</title>
</head>

<body>
    <main>
        <table>
            <caption><b><i>Fresh Fruits</i></b></caption>
            <colgroup>
                <col style="width: 300px;" />
                <col style="width: 200px;" />
            </colgroup>
            <tr>
                <td>
                    <p>
                        It has long been known that a diet that includes at least a few servings of fresh fruit every
                        day will help keep you healthy, fit and trim.
                    </p>
                </td>
                <td>
                    <img src="images/fruits.PNG" alt="fruits">
                </td>
            </tr>
            <tr>
                <table border="1" cellpadding="5">
                    <tr class="Row 1">
                        <td colspan="3">Title goes here</td>
                        <td>A</td>
                        <td>B</td>
                    </tr>
                    <tr class="Row 2">
                        <td rowspan="3">C</td>
                        <td>D</td>
                        <td>E</td>
                        <td>F</td>
                        <td>G</td>
                    </tr>
                    <tr class="Row 3">
                        <td>H</td>
                        <td colspan="2">I</td>
                        <td rowspan="2">J</td>
                    </tr>
                    <tr class="Row 4">
                        <td>K</td>
                        <td>L</td>
                        <td>M</td>
                    </tr>
                    <tr class="Row 5">
                        <td>N</td>
                        <td colspan="4">O</td>
                    </tr>
                </table>
            </tr>
        </table>
    </main>
</body>

</html>
