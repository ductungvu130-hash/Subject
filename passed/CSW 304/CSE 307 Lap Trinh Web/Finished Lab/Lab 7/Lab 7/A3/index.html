<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Messages</title>
    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        button {
            border: none;
            background-color: transparent;
        }

        i {
            color: #ffff;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="hidden">
                <div class="text-bg-success p-3 d-flex justify-content-between">
                    Success with contrasting color
                    <div>
                        <button onclick="deleteClick()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>
            <div class="hidden">
                <div class="text-bg-danger p-3 d-flex justify-content-between">
                    Danger with contrasting color
                    <div>
                        <button onclick="deleteClick()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        setTimeout(() => {
            document.querySelectorAll(".hidden").forEach(alert => {
                alert.style.display = "none";
            });
        }, 5000);
    </script>
</body>

</html>
