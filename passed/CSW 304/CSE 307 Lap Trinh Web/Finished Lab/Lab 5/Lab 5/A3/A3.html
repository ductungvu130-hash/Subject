<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Bootstrap CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
            integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
            crossorigin="anonymous"
        />
        <!-- Fontawesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <!-- CSS -->
        <link rel="stylesheet" href="style.css" />

        <title>Flower Shop</title>
    </head>

    <body>
        <main>
            <section class="slogan">
                <div class="container">
                    <div class="all-thing">
                        <div class="row">
                            <div class="col-md-4 col-12">
                                <div class="item">
                                    <div class="row">
                                        <div class="col-4">
                                            <div class="icons">
                                                <i class="fa-solid fa-truck fa-flip-horizontal fa-3x"></i>
                                            </div>
                                        </div>
                                        <div class="col-8">
                                            <div class="content">
                                                <h6>GIAO HÀNG MIỄN PHÍ</h6>
                                                <p>Chúng tôi giao hàng miễn phí trong nội thành</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4 col-12">
                                <div class="item">
                                    <div class="row">
                                        <div class="col-4">
                                            <div class="icons">
                                                <i class="fa-solid fa-comments fa-3x"></i>
                                            </div>
                                        </div>
                                        <div class="col-8">
                                            <div class="content">
                                                <h6>TƯ VẤN TẬN TÂM</h6>
                                                <p>Mang đến cho Quý Khách những sản phẩm tốt nhất</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4 col-12">
                                <div class="item">
                                    <div class="row">
                                        <div class="col-4">
                                            <div class="icons">
                                                <i class="fa-solid fa-dollar-sign fa-3x"></i>
                                            </div>
                                        </div>
                                        <div class="col-8">
                                            <div class="content">
                                                <h6>GIÁ THÀNH TỐT NHẤT</h6>
                                                <p>Cam kết giá thành &amp; và dịch vụ sau bán hàng tốt nhất</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
