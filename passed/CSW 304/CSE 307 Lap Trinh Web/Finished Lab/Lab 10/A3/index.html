<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gallery</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
            crossorigin="anonymous"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            img {
                max-height: 500px;
                width: 100%;
                height: 100%;
            }
            .small-picture img {
                max-width: 300px;
                max-height: 150px;
                width: 100%;
                height: 100%;
            }
            .hidden {
                display: none;
                position: relative;
            }
            .hidden button {
                position: absolute;
                top: 30px;
                right: 70px;
                background-color: transparent;
                border: none;
                color: #fff;
                font-size: 50px;
            }
            .hidden h2 {
                position: absolute;
                left: 50px;
                bottom: 20px;
                color: #ffff;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="container">
                <div class="row small-picture mt-1">
                    <div class="col-3">
                        <img src="images/1.jpg" alt="" />
                    </div>
                    <div class="col-3">
                        <img src="images/2.jpg" alt="" />
                    </div>
                    <div class="col-3">
                        <img src="images/3.jpg" alt="" />
                    </div>
                    <div class="col-3">
                        <img src="images/4.jpg" alt="" />
                    </div>
                </div>
                <div class="row large-picture">
                    <div class="col-12 mt-5 hidden">
                        <img src="" alt="" />
                        <button>X</button>
                        <h2></h2>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
            integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
            crossorigin="anonymous"
        ></script>
        <script>
            let sources = [
                { src: "1.jpg", name: "1" },
                { src: "2.jpg", name: "2" },
                { src: "3.jpg", name: "3" },
                { src: "4.jpg", name: "4" },
            ];

            $(".small-picture").on("click", function (event) {
                if (event.target.nodeName === "IMG") {
                    $(".large-picture img").attr("src", event.target.src);
                    let file = event.target.src.split("/").pop();
                    let title = sources.find((s) => s.src.endsWith(file))?.name || "";
                    $(".large-picture h2").text("Background " + title);
                    $(".hidden").css("display", "block");
                }
            });

            $(".large-picture").on("click", "button", function () {
                $(".hidden").css("display", "none");
            });
        </script>
    </body>
</html>
