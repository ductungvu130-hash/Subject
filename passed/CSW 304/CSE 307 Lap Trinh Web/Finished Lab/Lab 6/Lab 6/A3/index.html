<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Confirmation Box</title>
    </head>
    <body>
        <script>
            let result = confirm("Do you want to continue?");
            if (result) {
                console.log("User clicked OK");
            } else {
                console.log("User clicked Cancel");
            }
        </script>
    </body>
</html>
