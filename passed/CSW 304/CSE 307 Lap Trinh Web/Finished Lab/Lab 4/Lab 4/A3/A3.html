<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <title>Contact Form</title>
</head>

<body>
    <main>
        <section class="container-form">
            <div class="overlay-container-form">
                <h1>Contact Form</h1>
                <div class="overlay-intro">
                    <p>Nunc diam leo, fringilla vulputate elit lobortis, consectetur vestibulum quam. Sed id felis
                        ligula. In euismod libero at magna dapibus, in rutrum velit lacinia. Etiam a mi quis arcu varius
                        condimentum.</p>
                </div>
                <form action="" method="post">
                    <div class="form-div">
                        <div class="left-form">
                            <input type="text" name="" id="" placeholder="Name" required>
                            <input type="email" name="" id="" placeholder="Email" required>
                            <input type="text" name="" id="" placeholder="Subject" required>
                        </div>
                        <div class="right-form">
                            <textarea name="" id="" placeholder="Your message here..."></textarea>
                            <button type="submit">Send</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
