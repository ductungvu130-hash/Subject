<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>International Employees</title>
</head>

<body>
    <main>
        <table class="employee-table">
            <thead>
                <tr>
                    <th>Contact name</th>
                    <th>City</th>
                    <th>Country</th>
                    <th>Is Promoted</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Maria</td>
                    <td>Berlin</td>
                    <td><img src="images/germany-flag.png" class="flag">Germany</td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Ana Trujillo</td>
                    <td>México D.F.</td>
                    <td><img src="images/mexico-flag.jpg" class="flag">Mexico</td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Antonio Moreno</td>
                    <td>México D.F.</td>
                    <td><img src="images/mexico-flag.jpg" class="flag">Mexico</td>
                    <td><input type="checkbox" checked></td>
                </tr>
                <tr>
                    <td>Thomas Hardy</td>
                    <td>London</td>
                    <td><img src="images/uk-flag.png" class="flag">UK</td>
                    <td><input type="checkbox"></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
