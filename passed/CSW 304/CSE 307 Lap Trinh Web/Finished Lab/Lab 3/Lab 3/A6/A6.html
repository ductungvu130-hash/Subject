<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Ticket CSS</title>
</head>

<body>
    <main>
        <table class="ticket-table">
            <tr>
                <td colspan="2" class="ticket-id">Ticket ID: 12345678</td>
            </tr>
            <tr>
                <td>
                    <i><b>Name</b></i>
                </td>
                <td>
                    <span class="green-dot"></span>
                    <a href="#" class="name">Parker Tom</a>
                    <span class="status-active">No Active Support</span>
                </td>
            </tr>
            <tr>
                <td>
                    <i><b>Email</b></i>
                </td>
                <td>
                    <a href="#" class="email">tom@gmail.com</a>
                </td>
            </tr>
            <tr>
                <td>
                    <i><b>Response Time</b></i>
                </td>
                <td>
                    <span class="response-time">72 hours, 60 hours left</span>
                </td>
            </tr>
            <tr>
                <td>
                    <i><b>Last Action</b></i>
                </td>
                <td>
                    <span class="last-action">Never been locked</span>
                    <a href="#" class="last-action-link">Link to public post</a>
                </td>
            </tr>
            <tr>
                <td>
                    <i><b>Status</b></i>
                </td>
                <td>
                    <span class="status">No answered</span>
                </td>
            </tr>
        </table>
    </main>
</body>

</html>
