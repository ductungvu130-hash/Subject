<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Student Management System</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
            crossorigin="anonymous"
        />
        <style>
            table,
            th,
            td,
            tr {
                border: 1px solid #000;
                border-collapse: collapse;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <main class="m-5">
            <div class="mb-3">
                <h1 class="">Select Class</h1>
                <select id="class-dropdown">
                    <option value="">All Class</option>
                </select>
            </div>
            <h1>Student Table</h1>
            <table id="student-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Class</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
        <script>
            $.get(
                "http://139.180.213.49/getdata-student.php",
                { Type: "Class" },
                function (classes) {
                    console.log(classes);
                    for (let eachClass of classes) {
                        $("#class-dropdown").append(`<option value="${eachClass}">${eachClass}</option>`);
                    }
                },
                "json"
            );
            let studentData = [];
            $.get(
                "http://139.180.213.49/getdata-student.php",
                { Type: "Student" },
                function (students) {
                    console.log(students);
                    studentData = students;
                    showClass(studentData);
                },
                "json"
            );
            function showClass(students) {
                let tbody = $("#student-table tbody").empty();
                for (let student of students) {
                    tbody.append(
                        `<tr>
                            <td>${student.ID}</td>
                            <td>${student.Name}</td>
                            <td>${student.Email}</td>
                            <td>${student.Class}</td>
                        </tr>`
                    );
                }
            }
            $("#class-dropdown").on("change", function () {
                let selectClass = $(this).val();
                if (!selectClass) {
                    showClass(studentData);
                } else {
                    let studentClass = studentData.filter((each) => each.Class === selectClass);
                    showClass(studentClass);
                }
            });
        </script>
    </body>
</html>
