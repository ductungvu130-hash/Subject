<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedding </title>
</head>

<body>
    <main>
        <!-- Youtube -->
        <h1>Youtube video</h1>
        <iframe width="800" height="450" src="https://www.youtube.com/embed/sonUnFTOAEI"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <!-- EIU Website -->
        <h1>Vietnamnet news</h1>
        <iframe width="800" height="450" src="https://vietnamplus.vn" frameborder="0" title="Eiu Website"
            allowfullscreen></iframe>
        <!-- Map EIU -->
        <h1>Map EIU</h1>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3915.8127628277452!2d106.66393477498191!3d11.052660454037955!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3174d1d7df763eaf%3A0xf4323e44f2867057!2zxJDhuqFpIGjhu41jIFF14buRYyB04bq_IE1p4buBbiDEkMO0bmc!5e0!3m2!1svi!2s!4v1745599913187!5m2!1svi!2s"
            width="800" height="450" style="border: 0" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
    </main>
</body>

</html>
