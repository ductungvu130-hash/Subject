<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Form</title>
</head>
<body>

    <form action="#" method="POST">

        <fieldset>
            <legend>General Information</legend>
            
            <label for="fullname">Full Name</label>
            <input type="text" name="fullname" id="fullname"><br><br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email"><br><br>

            <label for="dob">DoB</label>
            <input type="date" name="dob" id="dob"><br><br>

            <label for="address">Address</label>
            <textarea name="address" id="address" rows="3" cols="30"></textarea>
        </fieldset>

        <br>
        
        <fieldset>
            <legend>Hobby</legend>
            
            <input type="checkbox" name="hobby" id="hobby_shopping" value="shopping">
            <label for="hobby_shopping">Shopping</label><br>

            <input type="checkbox" name="hobby" id="hobby_cooking" value="cooking">
            <label for="hobby_cooking">Cooking</label><br>

            <input type="checkbox" name="hobby" id="hobby_reading" value="reading">
            <label for="hobby_reading">Reading</label>
        </fieldset>

        <br>

        <fieldset>
            <legend>Password</legend>
            
            <label for="current_pw">Current Password</label>
            <input type="password" name="current_pw" id="current_pw"><br><br>

            <label for="new_pw">New password</label>
            <input type="password" name="new_pw" id="new_pw"><br><br>

            <label for="retype_pw">Re-type Password</label>
            <input type="password" name="retype_pw" id="retype_pw">
        </fieldset>

    </form>

</body>
</html>
