<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My to-do list</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            
        }
        
        .header{
            background-color: rgb(37, 146, 236);
            text-align: center;
            color: #fff;
            padding: 2px 2px;
        }

        .todo-container {
            margin: 0 auto;
            background: white;
        }

        input{
            border: none;
            width: 80%;
            padding: 10px;
            font-size: 16px;
        }

        .input-gr{
            display: flex;
            padding: 5px 5px;
        }

        .addBtn {
            padding: 12px;
            width: 20%;
            background: #d9d9d9;
            color: #555;
            text-align: center;
            cursor: pointer;
            border: none;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        ul li {
            position: relative;
            padding: 12px 8px 12px 40px;
            background: #f9f9f9;
            font-size: 16px;
            transition: 0.2s;
            user-select: none; 
        }
        
        ul li:nth-child(even) {
            background: #eeeeee;
        }

        ul li.checked {
            background: #888888;
            color: #fff;
            text-decoration: line-through;
        }

        ul li.checked::before {
            content: '';
            position: absolute;
            border-color: #fff;
            border-style: solid;
            border-width: 0 2px 2px 0;
            top: 10px;
            left: 16px;
            transform: rotate(45deg);
            height: 15px;
            width: 7px;
        }

        .close {
            position: absolute;
            right: 0;
            top: 0;
            padding: 12px 16px;
            color: #a0a0a0;
        }

    </style>
</head>
<body>
    <main>
        <div class = "todo-container" style="width: 500px;">
            <div class ="header">
                <h2>My To Do List</h2>
                <div class ="input-gr">
                    <input type="text" id="text" placeholder="Title..."/>
                    <button class ="addBtn" onclick="add()">Add</button>
                </div>
            </div>

            <ul id ="myUL">
                <li>Hit the gym<span class ="close">x</span></li>
                <li class ="checked">Marry <span class ="close">x</span></li>
                <li>Meet Girl Firend <span class ="close">x</span></li>
                <li>Buy eggs <span class ="close">x</span></li>
            </ul>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        function add() {
            let inputValue = $('#text').val().trim();
            if (!inputValue) {
                alert("Please enter a task title!");
            } else {
                $('#myUL').append(`<li> ${inputValue} <span class="close">x</span></li>`);
                $('#text').val('');
            }
        }

        $(document).ready(function() {
            $('#myUL').on('click', 'li', function() {
                $(this).toggleClass('checked');
            });

            $('#myUL').on('click', '.close', function() {
                if(confirm("Are you sure?")){
                    $(this).parent().remove();   
                }
            });
        });
    </script>
</body>
</html>
