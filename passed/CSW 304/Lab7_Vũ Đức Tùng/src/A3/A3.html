<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous"/>

    <style>
        main {
            padding: 90px 10px;
        }
        img {
            width: 100%;
            height: 100%;
        }
        .small-picture img {
            max-width: 500px;
            width: 100%;
            height: 100px;
            cursor: pointer;
        }
        .border-blue {
            border: 4px solid #0d6efd;
        }
        .large-image-group {
            position: relative;
            display: none;
            margin-top: 30px;
        }
        .delete {
            position: absolute;
            top: 10px;
            right: 20px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .large-image-group h2 {
            position: absolute;
            left: 20px;
            bottom: 20px;
            color: #ffff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }
    </style>    
</head>
<body>
    <main>
        <div class="container">
            <div class="row small-picture">
                <div class="col-3">
                    <img src="image/backgroundcity.png" class="small-image" />
                </div>
                <div class="col-3">
                    <img src="image/forest-background.png" class="small-image" />
                </div>
                <div class="col-3">
                    <img src="image/marine.png" class="small-image" />
                </div>
                <div class="col-3">
                    <img src="image/sky.png" class="small-image" />
                </div>
            </div> 

            <div class="row">
                <div class="col-12 large-image-group">
                    <span class="delete">x</span>
                    <img src="" class="large-image" />
                    <h2></h2>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            let currentIndex = 0;
            let slideInterval;

            function startSlideshow() {
                clearInterval(slideInterval);
                slideInterval = setInterval(function () {
                    currentIndex = (currentIndex + 1) % $(".small-image").length;
                    $(".small-image").eq(currentIndex).click();
                }, 5000);
            }

            $(".small-image").click(function () {
                let _src = $(this).attr("src");
                $(".large-image").attr("src", _src);
                $(".large-image-group").show();
                $(".border-blue").removeClass("border-blue");
                $(this).addClass("border-blue");

                currentIndex = $(".small-image").index(this);
                let title = _src.replace('image/', '').replace('.png', '').toUpperCase();
                $(".large-image-group h2").text(title);
                
                startSlideshow();
            });

            $(".delete").click(function () {
                $(".large-image-group").hide();
                $(".border-blue").removeClass("border-blue");
                clearInterval(slideInterval);
            });
        });
    </script>
</body>
</html>
