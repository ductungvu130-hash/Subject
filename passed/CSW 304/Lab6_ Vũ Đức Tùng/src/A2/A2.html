<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm box</title>
</head>
<body>
    <script>
        let result = confirm("Do you want to delete this order");
        if(result){
            console.log("User want to delete order");
        }else{
            console.log("User cancel the deletion");
        }
    </script>
</body>
</html>
