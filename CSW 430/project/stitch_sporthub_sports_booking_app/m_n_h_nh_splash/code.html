<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>SportHub - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes logo-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        @keyframes progress-loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-logo-float { animation: logo-float 3s ease-in-out infinite; }
        .animate-pulse-ring { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .progress-fill { animation: progress-loading 3s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

      min-height: max(884px, 100dvh);

<body class="bg-on-background m-0 p-0 overflow-hidden font-body-md text-on-surface">
<!-- Hero Background Wrapper -->
<div class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Blurred Modern Football Stadium Background -->
<div class="absolute inset-0 z-0 scale-110">
<div class="absolute inset-0 bg-gradient-to-b from-on-background/80 via-on-background/40 to-on-background/90 z-10"></div>
<div class="w-full h-full bg-cover bg-center filter blur-md" data-alt="A wide-angle, cinematic view of a state-of-the-art modern football stadium at night under brilliant floodlights. The lush green pitch is perfectly manicured with crisp white lines. The background shows tiered seating with atmospheric mist and lens flares from the high-performance lighting. The overall mood is high-energy, elite, and professionally athletic, with deep shadows and vibrant emerald greens." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAUahrU-Cs_zF_fD_qYPgDmGF5AJWf63NiaJgLdHRwh_oJyOKlnOHONyCjmK4eZQul4HxjUMugXI5u7KM6u4Dyi-0DLVPAdtnVwYW-_y_suojeshBIDzkn8Bau4APV8PkeLZjjC7KEjeRLA6WG5xZJnSKwCfekRQuzUGUzRiuRybRTqllsTk1gmHc4TcBxKIEBZYJITc7DZmv-iXgsmECpmFJdXbsn9fnn2-8c4Q5e62JbaVW7E8e_Q')">
</div>
</div>
<!-- Main Content Area -->
<div class="relative z-20 flex flex-col items-center px-margin-mobile">
<!-- Animated Logo Container -->
<div class="relative flex items-center justify-center w-32 h-32 md:w-40 md:h-40 mb-xs">
<!-- Pulse Effect Rings -->
<div class="absolute w-full h-full bg-primary/30 rounded-full animate-pulse-ring"></div>
<div class="absolute w-full h-full bg-primary/20 rounded-full animate-pulse-ring" style="animation-delay: 0.5s"></div>
<!-- Main SportHub Logo Symbol -->
<div class="relative bg-primary-container p-lg rounded-3xl shadow-2xl animate-logo-float flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] md:text-[80px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                        stadium
                    </span>
</div>
</div>
<!-- App Name Title -->
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-white tracking-tighter drop-shadow-lg opacity-0 translate-y-4 animate-in fade-in slide-in-from-bottom duration-1000 fill-mode-forwards" style="animation-delay: 0.3s">
                Sport<span class="text-primary-container">Hub</span>
</h1>
<!-- Tagline -->
<p class="font-label-lg text-label-lg text-white/70 mt-base tracking-widest uppercase opacity-0 animate-in fade-in duration-1000 fill-mode-forwards" style="animation-delay: 0.6s">
                Peak Performance Starts Here
            </p>
</div>
<!-- Bottom Loading State -->
<div class="absolute bottom-16 md:bottom-24 w-full max-w-[280px] px-margin-mobile flex flex-col items-center gap-md z-20">
<!-- Progress Bar Container -->
<div class="w-full h-[6px] bg-white/10 rounded-full overflow-hidden glass-effect">
<div class="progress-fill h-full bg-primary-container shadow-[0_0_15px_rgba(34,197,94,0.6)]"></div>
</div>
<!-- Loading Status Text -->
<span class="font-label-sm text-label-sm text-white/50 tracking-wider" id="loading-status">
                ĐANG KHỞI TẠO HỆ THỐNG...
            </span>
<!-- Spinner (Alternative interaction) -->
<div class="mt-xl flex items-center gap-xs">
<div class="w-1.5 h-1.5 bg-primary-container rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
<div class="w-1.5 h-1.5 bg-primary-container rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
<div class="w-1.5 h-1.5 bg-primary-container rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
</div>
</div>
<!-- Decorative Particles (Visual Depth) -->
<div class="absolute inset-0 pointer-events-none opacity-30 z-10" id="particle-container"></div>
</div>
<script>
        // Simple Micro-interaction: Update loading text
        const statusText = document.getElementById('loading-status');
        const messages = [
            "ĐANG KHỞI TẠO HỆ THỐNG...",
            "KẾT NỐI DỮ LIỆU SÂN CỎ...",
            "TỐI ƯU HÓA LỊCH TRÌNH...",
            "SẴN SÀNG TRẢI NGHIỆM!"
        ];
        
        let msgIndex = 0;
        const interval = setInterval(() => {
            msgIndex++;
            if (msgIndex < messages.length) {
                statusText.innerText = messages[msgIndex];
            } else {
                clearInterval(interval);
            }
        }, 800);

        // Particle generation for atmosphere
        const container = document.getElementById('particle-container');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute rounded-full bg-white opacity-20';
            const size = Math.random() * 4 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.left = `${Math.random() * 100}%`;
            
            const duration = Math.random() * 10 + 5;
            particle.style.animation = `float ${duration}s linear infinite`;
            
            container.appendChild(particle);
        }

        // Particle animation style
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes float {
                0% { transform: translateY(0) translateX(0); opacity: 0; }
                20% { opacity: 0.4; }
                80% { opacity: 0.4; }
                100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Transition simulation
        setTimeout(() => {
            // In a real app, this would navigate to the Dashboard or Login
            console.log("Splash sequence complete. Transitioning...");
        }, 3500);
    </script>
</body></html>
