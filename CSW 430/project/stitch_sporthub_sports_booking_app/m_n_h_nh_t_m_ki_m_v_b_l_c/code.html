<script>
        function toggleFilter() {
            const overlay = document.getElementById('filter-overlay');
            const isHidden = overlay.classList.contains('translate-y-full');
            
            if (isHidden) {
                overlay.classList.remove('translate-y-full');
                overlay.classList.add('translate-y-0');
            } else {
                overlay.classList.remove('translate-y-0');
                overlay.classList.add('translate-y-full');
            }
        }

        function toggleChip(btn) {
            const isActive = btn.classList.contains('active');
            const icon = btn.querySelector('.material-symbols-outlined');
            
            if (isActive) {
                btn.classList.remove('active', 'bg-primary', 'text-white', 'border-primary');
                btn.classList.add('text-on-surface-variant');
                if (icon) icon.style.fontVariationSettings = "'FILL' 0";
            } else {
                btn.classList.add('active', 'bg-primary', 'text-white', 'border-primary');
                btn.classList.remove('text-on-surface-variant');
                if (icon) icon.style.fontVariationSettings = "'FILL' 1";
            }
        }

        function resetFilters() {
            // Reset chips
            document.querySelectorAll('.chip').forEach(btn => {
                btn.classList.remove('active', 'bg-primary', 'text-white', 'border-primary');
                btn.classList.add('text-on-surface-variant');
                const icon = btn.querySelector('.material-symbols-outlined');
                if (icon) icon.style.fontVariationSettings = "'FILL' 0";
            });
            // Reset selects
            document.querySelector('select').selectedIndex = 0;
            // Reset radio
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            // Default range display
            document.getElementById('price-display').innerText = '0 - 1.000.000';
        }

        function applyFilters() {
            toggleFilter();
            // In a real app, logic to filter list would go here
        }

        // Simple mock micro-interaction for scrolling
        let lastScrollTop = 0;
        const topBar = document.getElementById('top-bar');
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 60) {
                topBar.style.transform = "translateY(-100%)";
            } else {
                topBar.style.transform = "translateY(0)";
            }
            topBar.style.transition = "transform 0.3s ease-in-out";
            lastScrollTop = scrollTop;
        });
    </script>
