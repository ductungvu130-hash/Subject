<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .form-input-focus:focus-within {
            border-color: #006e2f;
            box-shadow: 0 0 0 1px #006e2f;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- Top AppBar (from Shared Components JSON - Modified for Sub-page) -->
<nav class="flex items-center justify-between px-margin-mobile h-16 w-full fixed top-0 z-50 bg-surface dark:bg-on-background shadow-sm">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high active:scale-95 transition-all text-on-surface" onclick="history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg-mobile text-on-surface">Chỉnh sửa hồ sơ</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">verified_user</span>
</div>
</nav>
<main class="pt-24 px-margin-mobile max-w-2xl mx-auto">
<!-- Profile Picture Section -->
<div class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full border-4 border-primary-container overflow-hidden shadow-lg bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a young athletic person with a friendly smile, high-key bright lighting, wearing high-performance green and white sports apparel. The background is a clean, minimalist off-white studio setting, reflecting a premium and high-energy brand identity with a focus on fitness and health." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKwP33e6ylAIioGqtxIGFJfYFwlWd3qVVpyMTJ0_XnbrqCGv6YdsThqam_t8BVcPP4Ee-OcFf3GbyMSRUfo9-6iy7EnTiCl-Jw6ZEO4um9qYcq1Z0HuLHF4SN2D94Xk-kZpvWAH9Yx3_-wfiU5QSeWFQK-ldKg0iw7yR1cyMXFh_TZdpTYes3iI-XZvCYJ61UkbKAOwEdK4U6DoJvovHIa79f0ltHIhh9vKGV_XEF6cWBjqIe7qnpy"/>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center border-4 border-surface shadow-md active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">photo_camera</span>
</button>
</div>
<p class="mt-4 font-label-lg text-label-lg text-on-surface-variant">Thay đổi ảnh đại diện</p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="fullname">Họ và tên</label>
<div class="relative flex items-center group transition-all duration-200 border border-outline-variant rounded-xl bg-surface-container-lowest px-4 py-3.5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-on-surface outline-none" id="fullname" placeholder="Nhập họ và tên của bạn" type="text" value="Nguyễn Văn An"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="phone">Số điện thoại</label>
<div class="relative flex items-center group transition-all duration-200 border border-outline-variant rounded-xl bg-surface-container-lowest px-4 py-3.5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors">call</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-on-surface outline-none" id="phone" placeholder="Nhập số điện thoại" type="tel" value="0901 234 567"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative flex items-center group transition-all duration-200 border border-outline-variant rounded-xl bg-surface-container-lowest px-4 py-3.5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-on-surface outline-none" id="email" placeholder="Nhập địa chỉ email" type="email" value="an.nguyen@example.com"/>
</div>
</div>
<!-- Frequently Played Area -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="region">Khu vực thường chơi</label>
<div class="relative flex items-center group transition-all duration-200 border border-outline-variant rounded-xl bg-surface-container-lowest px-4 py-3.5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors">location_on</span>
<select class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-on-surface outline-none appearance-none" id="region">
<option value="q1">Quận 1, TP. Hồ Chí Minh</option>
<option selected="" value="q7">Quận 7, TP. Hồ Chí Minh</option>
<option value="q2">Quận 2, TP. Hồ Chí Minh</option>
<option value="bt">Quận Bình Thạnh, TP. Hồ Chí Minh</option>
<option value="td">TP. Thủ Đức</option>
</select>
<span class="material-symbols-outlined text-on-surface-variant absolute right-4 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Additional Settings Card -->
<div class="mt-8 bg-surface-container-low rounded-xl p-4 border border-outline-variant/30">
<h3 class="font-label-lg text-label-lg text-primary mb-3">Bảo mật &amp; Quyền riêng tư</h3>
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">lock</span>
<span class="font-body-md text-body-md">Đổi mật khẩu</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<div class="flex items-center justify-between py-2">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">visibility</span>
<span class="font-body-md text-body-md">Hiển thị hồ sơ công khai</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</div>
</div>
</form>
</main>
<!-- Save Changes Button Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container p-margin-mobile shadow-[0px_-4px_12px_rgba(30,64,175,0.08)] z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition-transform duration-150">
<span class="material-symbols-outlined">save</span>
                Lưu thay đổi
            </button>
</div>
</div>
<!-- Background Decoration for Premium Feel -->
<div class="fixed top-0 left-0 w-full h-full -z-10 opacity-30 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary-fixed blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] rounded-full bg-secondary-fixed blur-[100px]"></div>
</div>
<script>
        // Micro-interaction for feedback on save
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Đang lưu...
            `;
            
            setTimeout(() => {
                btn.classList.replace('bg-primary', 'bg-tertiary-container');
                btn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    Đã lưu thành công
                `;
                
                setTimeout(() => {
                    btn.classList.replace('bg-tertiary-container', 'bg-primary');
                    btn.innerHTML = originalContent;
                }, 2000);
            }, 1200);
        });

        // Hover effects for inputs
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.relative').classList.add('shadow-sm');
            });
            input.addEventListener('blur', () => {
                input.closest('.relative').classList.remove('shadow-sm');
            });
        });
    </script>
</body></html>
