<script>
        const dateContainer = document.getElementById('date-container');
        const timeGrid = document.getElementById('time-grid');
        const totalPriceEl = document.getElementById('total-price');
        const bookBtn = document.getElementById('book-btn');

        let selectedDate = 0;
        let selectedSlots = new Set();
        let totalAmount = 0;

        const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        const slots = [
            { time: '05:00 - 06:00', price: 80000, status: 'available' },
            { time: '06:00 - 07:00', price: 100000, status: 'unavailable' },
            { time: '07:00 - 08:00', price: 120000, status: 'available' },
            { time: '08:00 - 09:00', price: 120000, status: 'available' },
            { time: '09:00 - 10:00', price: 100000, status: 'unavailable' },
            { time: '16:00 - 17:00', price: 150000, status: 'available' },
            { time: '17:00 - 18:00', price: 200000, status: 'available' },
            { time: '18:00 - 19:00', price: 250000, status: 'available' },
            { time: '19:00 - 20:00', price: 250000, status: 'available' },
            { time: '20:00 - 21:00', price: 180000, status: 'available' },
            { time: '21:00 - 22:00', price: 120000, status: 'available' },
            { time: '22:00 - 23:00', price: 80000, status: 'available' },
        ];

        function initDates() {
            const today = new Date();
            for (let i = 0; i < 7; i++) {
                const date = new Date();
                date.setDate(today.getDate() + i);
                const dayName = days[date.getDay()];
                const dayNum = date.getDate();
                
                const card = document.createElement('button');
                card.className = `flex-shrink-0 w-14 h-20 rounded-xl flex flex-col items-center justify-center transition-all duration-200 ${i === 0 ? 'bg-primary text-white' : 'bg-surface-container-low text-on-surface-variant'}`;
                card.innerHTML = `
                    <span class="text-label-sm font-label-sm opacity-80">${dayName}</span>
                    <span class="text-title-lg font-title-lg">${dayNum}</span>
                `;
                card.onclick = () => {
                    document.querySelectorAll('#date-container button').forEach(b => {
                        b.classList.remove('bg-primary', 'text-white');
                        b.classList.add('bg-surface-container-low', 'text-on-surface-variant');
                    });
                    card.classList.add('bg-primary', 'text-white');
                    card.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
                    selectedDate = i;
                };
                dateContainer.appendChild(card);
            }
        }

        function initSlots() {
            slots.forEach((slot, index) => {
                const button = document.createElement('button');
                button.className = `p-3 flex flex-col items-center justify-center rounded-xl border-2 transition-all duration-200 active:scale-95 ${slot.status === 'unavailable' ? 'slot-unavailable' : 'bg-white border-outline-variant hover:border-primary'}`;
                button.innerHTML = `
                    <span class="font-label-lg text-[13px]">${slot.time}</span>
                    <span class="text-primary font-bold text-[12px] mt-1 ${slot.status === 'unavailable' ? 'text-on-surface-variant' : ''}">${slot.price.toLocaleString()}đ</span>
                `;

                if (slot.status !== 'unavailable') {
                    button.onclick = () => {
                        if (selectedSlots.has(index)) {
                            selectedSlots.delete(index);
                            button.classList.remove('slot-selected');
                            totalAmount -= slot.price;
                        } else {
                            selectedSlots.add(index);
                            button.classList.add('slot-selected');
                            totalAmount += slot.price;
                        }
                        updateUI();
                    };
                }
                timeGrid.appendChild(button);
            });
        }

        function updateUI() {
            totalPriceEl.innerText = `${totalAmount.toLocaleString()}đ`;
            bookBtn.disabled = selectedSlots.size === 0;
            if (selectedSlots.size > 0) {
                bookBtn.innerText = `Đặt ngay (${selectedSlots.size})`;
            } else {
                bookBtn.innerText = `Tiếp tục`;
            }
        }

        function handleBooking() {
            alert('Đang chuyển đến màn hình thanh toán cho ' + selectedSlots.size + ' khung giờ.');
        }

        initDates();
        initSlots();
    </script>
