<script>
function rcForgotPassword() {
  const email = prompt('Nhập email để nhận liên kết đặt lại mật khẩu:');
  if (email && email.trim()) {
    RC.toast('Đã gửi email đặt lại mật khẩu tới ' + email.trim() + ' (mô phỏng)');
  }
}
function rcTogglePassword(btn) {
  const input = document.getElementById('password');
  const icon = btn.querySelector('.material-symbols-outlined');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility_off';
  }
}
</script>
