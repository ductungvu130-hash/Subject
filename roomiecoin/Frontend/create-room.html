</div>

<option value="5">Ngày 5 hàng tháng</option>

<option value="15">Ngày 15 hàng tháng</option>
<option value="30">Ngày 30 hàng tháng</option>

<script>
function rcCreateRoom() {
  const name = document.getElementById('roomName').value.trim();
  if (!name) { RC.toast('Vui lòng nhập tên phòng', 'error'); document.getElementById('roomName').focus(); return; }
  RC.set('room_name', name);
  RC.toast('Đã tạo phòng "' + name + '" thành công!');
  setTimeout(function () { window.location.href = 'room.html'; }, 700);
}
</script>
